<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VELTIX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RESET & TOKENS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:     #00f0ff;
      --cyan-dim: rgba(0,240,255,.12);
      --gold:     #ffd700;
      --gold-dim: rgba(255,215,0,.12);
      --green:    #00e676;
      --red:      #ff4d4d;
      --dark:     #03080f;
      --surface:  rgba(6,14,34,.82);
      --border:   rgba(0,240,255,.1);
      --nav-h:    72px;
      --hdr-h:    72px;
      --safe-b:   env(safe-area-inset-bottom, 0px);
    }

    html { height: 100%; }
    body {
      height: 100%; width: 100%;
      background: var(--dark);
      color: #fff;
      font-family: 'Rajdhani', system-ui, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BACKGROUND SYSTEM
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .bg-space {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 130% 70% at 50% -10%, #071a45 0%, transparent 58%),
        radial-gradient(ellipse 70% 55% at 100% 110%, #1b0438 0%, transparent 52%),
        radial-gradient(ellipse 60% 50% at -5% 90%,  #011d36 0%, transparent 48%),
        #03080f;
    }
    .bg-hex {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: radial-gradient(circle, rgba(0,240,255,.1) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 10%, transparent 100%);
      animation: hexMove 22s linear infinite;
    }
    @keyframes hexMove { to { background-position: 34px 34px; } }

    .bg-lines {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,240,255,.008) 2px, rgba(0,240,255,.008) 3px
      );
    }

    .orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
      filter: blur(120px); animation: orbDrift 16s ease-in-out infinite alternate;
    }
    .orb-a { width:500px; height:500px; background:#0080cc; opacity:.07; top:-200px; left:-180px; }
    .orb-b { width:380px; height:380px; background:#cc8800; opacity:.06; bottom:-150px; right:-150px; animation-delay:-7s; }
    .orb-c { width:220px; height:220px; background:#5500cc; opacity:.08; top:40%; left:62%; animation-delay:-12s; }
    @keyframes orbDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,24px) scale(1.12); }
    }

    /* ambient particles */
    .pts { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
    .pt  { position:absolute; border-radius:50%; opacity:0; animation:ptRise linear infinite; }
    .pt:nth-child(1)  { left: 6%; width:3px;height:3px; background:var(--gold); animation-duration:11s; animation-delay:0s; }
    .pt:nth-child(2)  { left:16%; width:2px;height:2px; background:var(--cyan); animation-duration:14s; animation-delay:2s; }
    .pt:nth-child(3)  { left:28%; width:2px;height:2px; background:var(--gold); animation-duration: 9s; animation-delay:5s; }
    .pt:nth-child(4)  { left:40%; width:2px;height:2px; background:var(--cyan); animation-duration:12s; animation-delay:1s; }
    .pt:nth-child(5)  { left:53%; width:3px;height:3px; background:var(--gold); animation-duration: 8s; animation-delay:3.5s; }
    .pt:nth-child(6)  { left:65%; width:2px;height:2px; background:var(--cyan); animation-duration:15s; animation-delay:0.5s; }
    .pt:nth-child(7)  { left:78%; width:2px;height:2px; background:var(--gold); animation-duration:10s; animation-delay:4s; }
    .pt:nth-child(8)  { left:90%; width:2px;height:2px; background:var(--cyan); animation-duration:12s; animation-delay:7s; }
    @keyframes ptRise {
      0%   { transform:translateY(105vh); opacity:0; }
      8%   { opacity:.75; }
      90%  { opacity:.3; }
      100% { transform:translateY(-5vh) translateX(18px); opacity:0; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       LOADER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: var(--dark);
      transition: opacity .55s ease, visibility .55s ease;
    }
    #loader.out { opacity: 0; visibility: hidden; pointer-events: none; }

    .ld-ring {
      position: relative; width: 84px; height: 84px;
    }
    .ld-ring::before {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--cyan) 0%, var(--gold) 50%, var(--cyan) 100%);
      animation: spin 1.3s linear infinite;
    }
    .ld-ring::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--cyan), var(--gold), var(--cyan));
      filter: blur(8px); opacity: .5; animation: spin 1.3s linear infinite;
    }
    .ld-logo {
      position: relative; z-index: 1;
      width: 76px; height: 76px; border-radius: 50%;
      object-fit: cover; display: block; margin: auto;
      border: 3px solid var(--dark);
    }
    .ld-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(0,240,255,.5);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.3;} 50%{opacity:1;} }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       APP SHELL
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #app {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      opacity: 0; transition: opacity .5s ease;
    }
    #app.show { opacity: 1; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       HEADER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .hdr {
      position: relative; z-index: 50;
      height: var(--hdr-h); flex-shrink: 0;
      display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      background: rgba(3,8,15,.8);
      backdrop-filter: blur(24px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }
    .hdr::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 30%, var(--gold) 70%, transparent 100%);
      opacity: .35;
    }

    /* Avatar */
    .hdr-avatar {
      position: relative; flex-shrink: 0;
      width: 44px; height: 44px;
    }
    .hdr-avatar-ring {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--gold), var(--cyan), var(--gold));
      animation: spin 5s linear infinite;
    }
    .hdr-avatar-inner {
      position: absolute; inset: 0; border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,240,255,.18), rgba(255,215,0,.12));
      border: 2px solid rgba(3,8,15,.9);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 17px; font-weight: 900;
      color: var(--cyan);
      z-index: 1;
    }

    /* User info */
    .hdr-info { flex: 1; min-width: 0; }
    .hdr-nick {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      color: #fff; line-height: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hdr-sub {
      display: flex; align-items: center; gap: 6px; margin-top: 4px;
    }
    .hdr-lvl {
      font-family: 'Orbitron', sans-serif;
      font-size: 8px; font-weight: 700; letter-spacing: 1.5px;
      color: var(--gold);
      background: linear-gradient(135deg, rgba(25,16,0,.9), rgba(45,30,0,.9));
      border: 1px solid rgba(255,215,0,.38);
      border-radius: 6px; padding: 2px 7px;
      box-shadow: 0 0 10px rgba(255,215,0,.18);
    }

    /* Coin display in header */
    .hdr-coins {
      display: flex; align-items: center; gap: 6px;
      background: var(--gold-dim);
      border: 1px solid rgba(255,215,0,.22);
      border-radius: 20px; padding: 6px 12px 6px 8px;
      flex-shrink: 0;
    }
    .hdr-coin-icon {
      width: 22px; height: 22px; border-radius: 50%;
      object-fit: cover;
      filter: drop-shadow(0 0 4px rgba(255,215,0,.6));
    }
    .hdr-coin-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255,215,0,.5);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SCROLLABLE CONTENT
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
      scrollbar-width: none; overscroll-behavior: contain;
    }
    .content::-webkit-scrollbar { display: none; }

    /* inner wrapper */
    .inner {
      display: flex; flex-direction: column; align-items: center;
      padding: 18px 16px 0;
      max-width: 420px; margin: 0 auto;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       STATS ROW
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; width: 100%; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      backdrop-filter: blur(14px);
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      border-radius: 16px 16px 0 0;
    }
    .stat-card.c-gold::before  { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .stat-card.c-cyan::before  { background: linear-gradient(90deg, transparent, var(--cyan), transparent); }
    .stat-card.c-green::before { background: linear-gradient(90deg, transparent, var(--green), transparent); }
    .stat-emoji { font-size: 16px; line-height: 1; }
    .stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px; font-weight: 900; line-height: 1.1;
      transition: transform .15s;
    }
    .stat-val.pop { animation: numPop .22s ease; }
    @keyframes numPop { 0%{transform:scale(1)} 50%{transform:scale(1.35)} 100%{transform:scale(1)} }
    .stat-card.c-gold  .stat-val { color:var(--gold);  text-shadow:0 0 10px rgba(255,215,0,.5); }
    .stat-card.c-cyan  .stat-val { color:var(--cyan);  text-shadow:0 0 10px rgba(0,240,255,.5); }
    .stat-card.c-green .stat-val { color:var(--green); text-shadow:0 0 10px rgba(0,230,118,.5); }
    .stat-lbl {
      font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,.28);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       COIN TAP ZONE
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .coin-wrap {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 18px;
    }

    .coin-zone {
      position: relative;
      width: 230px; height: 230px;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
    }

    /* Outer ambient glow disc */
    .coin-aura {
      position: absolute; inset: -30px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(0,240,255,.15) 0%, rgba(255,215,0,.07) 45%, transparent 70%);
      animation: aura 4s ease-in-out infinite;
    }
    @keyframes aura { 0%,100%{transform:scale(1); opacity:.65;} 50%{transform:scale(1.1); opacity:1;} }

    /* Ring 1 — gold conic, slow */
    .rg1 {
      position: absolute; inset: -14px; border-radius: 50%;
      background: conic-gradient(from 0deg,
        #4a2d00 0%, #ffd700 15%, #fff0a0 30%, #ffd700 45%,
        #7a4d00 55%, #ffd700 70%, #fff0a0 85%, #4a2d00 100%);
      animation: spin 8s linear infinite;
    }
    .rg1::after { content:''; position:absolute; inset:7px; border-radius:50%; background:#03080f; }

    /* Ring 2 — cyan dashes, CCW */
    .rg2 {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg,
        transparent  0deg, var(--cyan)  55deg, rgba(0,240,255,.25)  90deg, transparent 110deg,
        transparent 180deg, #00c8ff    235deg, rgba(0,200,255,.25)  270deg, transparent 290deg
      );
      animation: spinR 3.5s linear infinite;
    }
    .rg2::after { content:''; position:absolute; inset:5px; border-radius:50%; background:#03080f; }

    /* Ring 3 — white shimmer, fast CW */
    .rg3 {
      position: absolute; inset: 4px; border-radius: 50%;
      background: conic-gradient(from 0deg,
        transparent  0deg, rgba(255,255,255,.22)  28deg, transparent  56deg,
        transparent 180deg, rgba(0,240,255,.18) 208deg, transparent 236deg
      );
      animation: spin 2.4s linear infinite;
    }
    .rg3::after { content:''; position:absolute; inset:5px; border-radius:50%; background:#03080f; }

    /* Coin image */
    .coin-img {
      position: absolute; inset: 12px;
      width: calc(100% - 24px); height: calc(100% - 24px);
      border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(255,215,0,.3);
      box-shadow:
        0 0 24px rgba(0,240,255,.35),
        0 0 48px rgba(255,215,0,.14),
        inset 0 0 20px rgba(0,0,0,.45);
      animation: coinFloat 4s ease-in-out infinite, coinShine 9s ease-in-out infinite;
    }
    @keyframes coinFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-11px); }
    }
    @keyframes coinShine {
      0%,100% { filter: brightness(1)    drop-shadow(0 0 14px rgba(0,240,255,.5)); }
      30%      { filter: brightness(1.2)  drop-shadow(6px 0 22px rgba(0,240,255,.8)); }
      70%      { filter: brightness(1.2)  drop-shadow(-6px 0 22px rgba(255,215,0,.6)); }
    }

    /* Tap bounce */
    .coin-zone.tapped .coin-img  { animation: coinBounce .32s cubic-bezier(.36,.07,.19,.97) both; }
    .coin-zone.tapped .coin-aura { animation: auraFlash .32s ease-out both; }
    @keyframes coinBounce {
      0%  { transform:scale(1); }
      22% { transform:scale(.84) rotate(-5deg); }
      55% { transform:scale(1.14) rotate(3deg); }
      80% { transform:scale(.97); }
      100%{ transform:scale(1); }
    }
    @keyframes auraFlash {
      0%  { transform:scale(1);    opacity:.65; }
      40% { transform:scale(1.25); opacity:1; filter:brightness(2); }
      100%{ transform:scale(1.05); opacity:.65; }
    }

    /* Pulse ring that fires on tap */
    .coin-pulse {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(0,240,255,.75);
      opacity: 0; pointer-events: none;
    }
    .coin-zone.tapped .coin-pulse { animation: pulseOut .5s ease-out forwards; }
    @keyframes pulseOut {
      0%  { transform:scale(1);    opacity:.85; }
      100%{ transform:scale(1.65); opacity:0; }
    }

    /* No-energy shake */
    .coin-zone.empty { animation: shake .3s ease; }
    @keyframes shake {
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-7px);}
      40%{transform:translateX(7px);}
      60%{transform:translateX(-4px);}
      80%{transform:translateX(4px);}
    }

    /* TAP hint */
    .tap-hint {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(0,240,255,.3);
      margin-top: 4px; margin-bottom: 14px;
      animation: hintBlink 2.5s ease-in-out infinite;
    }
    @keyframes hintBlink { 0%,100%{opacity:.3;} 50%{opacity:.7;} }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       ENERGY SECTION
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .energy-box {
      width: 100%; margin-bottom: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 14px 16px;
      backdrop-filter: blur(14px);
    }
    .energy-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .energy-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(0,240,255,.5); font-weight: 700;
    }
    .energy-label svg { width: 14px; height: 14px; fill: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }
    .energy-nums {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 900; color: var(--cyan);
      text-shadow: 0 0 8px rgba(0,240,255,.5);
    }
    .energy-track {
      position: relative; height: 10px; border-radius: 10px;
      background: rgba(0,240,255,.06);
      border: 1px solid rgba(0,240,255,.1);
      overflow: hidden;
    }
    .energy-fill {
      height: 100%; border-radius: 10px;
      background: linear-gradient(90deg, #007a8a, #00ccdd, var(--cyan));
      box-shadow: 0 0 12px rgba(0,240,255,.55);
      transition: width .35s ease;
      position: relative;
    }
    /* animated shine on fill */
    .energy-fill::after {
      content: ''; position: absolute;
      top: 0; right: 0; bottom: 0; width: 40px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.38));
      border-radius: 10px;
    }
    .energy-meta {
      display: flex; justify-content: space-between;
      margin-top: 6px;
    }
    .energy-regen {
      font-size: 9px; letter-spacing: 1.5px;
      color: rgba(0,240,255,.28);
    }
    .energy-pct {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; color: rgba(0,240,255,.35);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       INFO CARDS GRID
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .grid2 {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; width: 100%; margin-bottom: 20px;
    }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 16px 14px;
      backdrop-filter: blur(14px);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      position: relative; overflow: hidden;
    }
    .info-card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,240,255,.03) 0%, transparent 60%);
      pointer-events: none;
    }
    .ic-icon { font-size: 24px; }
    .ic-lbl  { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.25); }
    .ic-val  {
      font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900;
    }
    .ic-val.gold  { color:var(--gold);  text-shadow:0 0 12px rgba(255,215,0,.45); }
    .ic-val.cyan  { color:var(--cyan);  text-shadow:0 0 12px rgba(0,240,255,.45); }
    .ic-sub  { font-size: 9px; color: rgba(255,255,255,.2); }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       TAP EFFECTS (DOM-spawned)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .fx-plus {
      position: fixed; pointer-events: none; z-index: 9000;
      font-family: 'Orbitron', sans-serif;
      font-size: 22px; font-weight: 900;
      color: #ffe566;
      text-shadow: 0 0 12px var(--gold), 0 0 24px rgba(255,215,0,.5);
      animation: fxPlus .95s cubic-bezier(.22,1,.36,1) forwards;
      white-space: nowrap;
    }
    @keyframes fxPlus {
      0%  { transform: translateY(0) scale(1);       opacity: 1; }
      25% { transform: translateY(-22px) scale(1.3); opacity: 1; }
      100%{ transform: translateY(-85px) scale(.7);  opacity: 0; }
    }

    .fx-spark {
      position: fixed; pointer-events: none; z-index: 9000;
      border-radius: 50%;
      animation: fxSpark var(--d) ease-out forwards;
    }
    @keyframes fxSpark {
      0%  { transform:translate(0,0) scale(1.2); opacity:1; }
      100%{ transform:translate(var(--x),var(--y)) scale(0); opacity:0; }
    }

    .fx-ripple {
      position: fixed; pointer-events: none; z-index: 9000;
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid rgba(0,240,255,.85);
      transform: translate(-50%,-50%);
      animation: fxRipple .55s ease-out forwards;
    }
    @keyframes fxRipple {
      0%  { transform:translate(-50%,-50%) scale(1);   opacity:.9; }
      100%{ transform:translate(-50%,-50%) scale(5.5); opacity:0; }
    }

    .fx-coin {
      position: fixed; pointer-events: none; z-index: 9000;
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 8px var(--gold), 0 0 18px rgba(255,165,0,.6);
      animation: fxCoin 1.05s cubic-bezier(.25,.46,.45,.94) forwards;
    }
    @keyframes fxCoin {
      0%  { transform:translateY(0) scale(1) rotate(0deg); opacity:1; }
      60% { opacity:1; }
      100%{ transform:translateY(-105px) scale(.28) rotate(380deg); opacity:0; }
    }

    .fx-nrg {
      position: fixed; pointer-events: none; z-index: 9000;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 2px;
      color: var(--red); text-shadow: 0 0 10px rgba(255,77,77,.7);
      transform: translateX(-50%);
      animation: fxNrg .75s ease-out forwards;
    }
    @keyframes fxNrg {
      0%  { transform:translateX(-50%) translateY(0); opacity:1; }
      100%{ transform:translateX(-50%) translateY(-45px); opacity:0; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BOTTOM NAVIGATION
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(3,8,15,.92);
      backdrop-filter: blur(28px) saturate(1.5);
      border-top: 1px solid var(--border);
      display: flex; align-items: stretch;
    }
    /* Neon top line */
    .nav::before {
      content: ''; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan) 35%, var(--gold) 65%, transparent);
      opacity: .3;
    }

    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      border: none; background: none; cursor: pointer; padding: 0;
      position: relative; transition: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Active indicator bar */
    .nav-btn.active::before {
      content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 2px;
      border-radius: 0 0 4px 4px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan), 0 0 20px rgba(0,240,255,.5);
    }

    /* Active glow behind icon */
    .nav-btn.active .nav-icon-wrap {
      filter: drop-shadow(0 0 8px var(--cyan));
    }

    .nav-icon-wrap {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      transition: filter .2s;
    }
    .nav-icon-wrap svg {
      width: 100%; height: 100%;
      fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
      transition: stroke .2s;
    }
    .nav-btn.active .nav-icon-wrap svg { stroke: var(--cyan); }
    .nav-btn:not(.active) .nav-icon-wrap svg { stroke: rgba(255,255,255,.28); }
    .nav-btn:not(.active):active .nav-icon-wrap svg { stroke: rgba(255,255,255,.5); }

    .nav-lbl {
      font-family: 'Orbitron', sans-serif;
      font-size: 7.5px; letter-spacing: 1.5px; text-transform: uppercase;
      transition: color .2s;
    }
    .nav-btn.active .nav-lbl { color: var(--cyan); }
    .nav-btn:not(.active) .nav-lbl { color: rgba(255,255,255,.22); }

    /* EARN badge */
    .nav-dot {
      position: absolute; top: 8px; right: calc(50% - 16px);
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold), 0 0 16px rgba(255,215,0,.5);
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100%{opacity:.8;} 50%{opacity:1; transform:scale(1.25);} }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       COMING SOON TOAST
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 14px); left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(6,14,34,.92);
      border: 1px solid rgba(255,215,0,.35);
      border-radius: 30px; padding: 10px 22px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gold);
      box-shadow: 0 0 24px rgba(255,215,0,.2);
      opacity: 0; pointer-events: none; z-index: 9999;
      transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* shared spin keyframes */
    @keyframes spin  { to { transform: rotate( 360deg); } }
    @keyframes spinR { to { transform: rotate(-360deg); } }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RESPONSIVE TWEAKS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (max-width: 360px) {
      .coin-zone { width: 200px; height: 200px; }
      .stat-val  { font-size: 13px; }
      .hdr-nick  { font-size: 11px; }
    }
    @media (max-height: 680px) {
      .coin-zone { width: 195px; height: 195px; }
      .inner     { padding-top: 12px; }
      .stats-row { margin-bottom: 14px; }
      .tap-hint  { margin-bottom: 8px; }
      .energy-box { margin-bottom: 14px; }
    }
    @media (max-height: 580px) {
      .coin-zone    { width: 170px; height: 170px; }
      .energy-box,
      .grid2        { display: none; }
    }
  </style>
</head>
<body>

  <!-- BOTTOM NAV -->

      <div class="nav-icon-wrap">

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     FIREBASE + GAME LOGIC
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<script type="module">
import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
                               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
                               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ── Firebase init ─────────────────────────────────────────── */
const app  = initializeApp({
  apiKey:     "AIzaSyCU5JdLURDc23XCZPZU49EIc_BdNgllsno",
  authDomain: "veltix-game.firebaseapp.com",
  projectId:  "veltix-game"
});
const auth = getAuth(app);
const db   = getFirestore(app);

/* ── Constants ─────────────────────────────────────────────── */
const MAX_ENERGY   = 500;
const REGEN_MS     = 3000;   // +1 energy every 3 s
const SAVE_DELAY   = 1500;   // debounce Firestore writes
const SPARK_COLORS = ["#00f0ff","#ffd700","#ffffff","#ff9900","#00ff88","#ff66cc"];

/* ── State ─────────────────────────────────────────────────── */
let G = { coin: 0, level: 1, energy: MAX_ENERGY };
let userRef   = null;
let saveTimer = null;

/* ── Auth guard ────────────────────────────────────────────── */
onAuthStateChanged(auth, async (user) => {
  if (!user || !user.emailVerified) {
    window.location.href = "/login.html";
    return;
  }

  // Resolve nickname
  const nick    = user.displayName || user.email.split("@")[0];
  const initial = nick.charAt(0).toUpperCase();

  document.getElementById("nickEl").textContent   = nick;
  document.getElementById("avatarEl").textContent = initial;

  userRef = doc(db, "players", user.uid);
  await loadData();

  render();
  startRegen();

  document.getElementById("loader").classList.add("out");
  document.getElementById("app").classList.add("show");
});

/* ── Firestore load / save ─────────────────────────────────── */
async function loadData() {
  try {
    const snap = await getDoc(userRef);
    if (snap.exists()) {
      const d = snap.data();
      G.coin   = d.coin   ?? 0;
      G.level  = d.level  ?? 1;
      G.energy = Math.min(d.energy ?? MAX_ENERGY, MAX_ENERGY);
    }
  } catch (e) { console.warn("Load failed:", e.message); }
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!userRef) return;
    setDoc(userRef, { coin: G.coin, level: G.level, energy: G.energy }, { merge: true })
      .catch(e => console.warn("Save failed:", e.message));
  }, SAVE_DELAY);
}

/* ── Render ────────────────────────────────────────────────── */
function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1)+"M";
  if (n >= 1e3) return (n/1e3).toFixed(1)+"K";
  return String(n);
}

function render() {
  const power = Math.floor((G.level - 1) / 10) + 1;
  const pct   = Math.round(G.energy / MAX_ENERGY * 100);

  // Header
  document.getElementById("hdrCoins").textContent  = fmtNum(G.coin);
  document.getElementById("lvlBadge").textContent   = "LV " + G.level;

  // Stats row
  document.getElementById("s-coins").textContent   = fmtNum(G.coin);
  document.getElementById("s-energy").textContent  = G.energy;
  document.getElementById("s-level").textContent   = G.level;

  // Energy bar
  document.getElementById("eVal").textContent      = G.energy;
  document.getElementById("eMax").textContent      = MAX_ENERGY;
  document.getElementById("eBar").style.width      = pct + "%";
  document.getElementById("ePct").textContent      = pct + "%";

  // Cards
  document.getElementById("ic-total").textContent  = fmtNum(G.coin);
  document.getElementById("ic-power").textContent  = "+" + power;
}

function popEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("pop");
  void el.offsetWidth;
  el.classList.add("pop");
  setTimeout(() => el.classList.remove("pop"), 260);
}

/* ── Energy regen ──────────────────────────────────────────── */
function startRegen() {
  setInterval(() => {
    if (G.energy < MAX_ENERGY) {
      G.energy = Math.min(G.energy + 1, MAX_ENERGY);
      const pct = Math.round(G.energy / MAX_ENERGY * 100);
      document.getElementById("s-energy").textContent = G.energy;
      document.getElementById("eVal").textContent     = G.energy;
      document.getElementById("eBar").style.width     = pct + "%";
      document.getElementById("ePct").textContent     = pct + "%";
    }
  }, REGEN_MS);
}

/* ── Visual FX ─────────────────────────────────────────────── */
function spawnSparks(x, y, n = 12) {
  for (let i = 0; i < n; i++) {
    const el    = document.createElement("div");
    el.className = "fx-spark";
    const angle  = (360 / n) * i + (Math.random() - .5) * 22;
    const dist   = 48 + Math.random() * 72;
    const rad    = angle * Math.PI / 180;
    const size   = 4 + Math.random() * 4;
    const clr    = SPARK_COLORS[i % SPARK_COLORS.length];
    el.style.cssText = `
      left:${x}px; top:${y}px;
      width:${size}px; height:${size}px;
      background:${clr};
      box-shadow:0 0 6px ${clr};
      --x:${(Math.cos(rad)*dist).toFixed(1)}px;
      --y:${(Math.sin(rad)*dist).toFixed(1)}px;
      --d:${(.3+Math.random()*.5).toFixed(2)}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
}

function spawnRipple(x, y) {
  const el = document.createElement("div");
  el.className = "fx-ripple";
  el.style.cssText = `left:${x}px; top:${y}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 570);
}

function spawnPlus(x, y, amt) {
  const el = document.createElement("div");
  el.className = "fx-plus";
  el.textContent = "+" + amt;
  el.style.cssText = `left:${x + 18}px; top:${y - 10}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 960);
}

function spawnCoinImg(x, y) {
  const el = document.createElement("img");
  el.src = "logoveltix.png";
  el.className = "fx-coin";
  el.style.cssText = `left:${x - 13}px; top:${y - 13}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function spawnNoEnergy(x, y) {
  const el = document.createElement("div");
  el.className = "fx-nrg";
  el.textContent = "NO ENERGY";
  el.style.cssText = `left:${x}px; top:${y}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 780);
}

function bounceCoin() {
  const z = document.getElementById("coinZone");
  z.classList.remove("tapped");
  void z.offsetWidth;
  z.classList.add("tapped");
  setTimeout(() => z.classList.remove("tapped"), 380);
}

function shakeEmpty(x, y) {
  const z = document.getElementById("coinZone");
  z.classList.remove("empty");
  void z.offsetWidth;
  z.classList.add("empty");
  setTimeout(() => z.classList.remove("empty"), 340);
  spawnNoEnergy(x, y);
}

/* ── Tap handler ───────────────────────────────────────────── */
let lastTap = 0;

window.doTap = function(ev) {
  ev.preventDefault();
  const now = Date.now();
  if (now - lastTap < 80) return;
  lastTap = now;

  let x, y;
  if (ev.touches && ev.touches.length) {
    x = ev.touches[0].clientX;
    y = ev.touches[0].clientY;
  } else {
    x = ev.clientX;
    y = ev.clientY;
  }

  if (G.energy <= 0) { shakeEmpty(x, y); return; }

  const power = Math.floor((G.level - 1) / 10) + 1;
  G.coin  += power;
  G.energy = Math.max(0, G.energy - 1);

  save();
  render();

  bounceCoin();
  popEl("s-coins");
  popEl("hdrCoins");
  spawnRipple(x, y);
  spawnSparks(x, y, 12);
  spawnCoinImg(x, y);
  spawnPlus(x, y, power);
};

/* ── Nav tab routing ───────────────────────────────────────── */
let toastTimer = null;

window.goTab = function(tab, el) {
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");

  if (tab !== "home") {
    // Show coming-soon toast; reset to home after 2 s
    const toast = document.getElementById("toast");
    toast.textContent = "◆ COMING SOON ◆";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("nb-home").classList.add("active");
    }, 2000);
  }
};

/* ── Logout (callable from future profile page) ─────────────── */
window.doLogout = function() {
  save();
  setTimeout(() => {
    signOut(auth).then(() => { window.location.href = "/login.html"; });
  }, SAVE_DELAY + 200);
};
</script>
