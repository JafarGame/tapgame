<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VELTIX Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020617;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Animated starfield background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #0a1a4a 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, #1a0a30 0%, transparent 60%),
        #020617;
    }

    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 50%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 50%, rgba(255,255,255,0.3) 0%, transparent 100%);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0%   { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: drift 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb1 { width: 400px; height: 400px; background: #00f0ff; top: -100px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 300px; height: 300px; background: #ffd700; bottom: -80px; right: -80px; animation-delay: -3s; }
    .orb3 { width: 200px; height: 200px; background: #7b2fff; top: 50%; left: 50%; animation-delay: -5s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.1); }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      width: min(360px, 92vw);
      padding: 40px 36px 36px;
      border-radius: 28px;
      background: rgba(8, 15, 35, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 240, 255, 0.18);
      box-shadow:
        0 0 0 1px rgba(0,240,255,0.06),
        0 8px 40px rgba(0,0,0,0.6),
        0 0 60px rgba(0,240,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.06);
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo-ring {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 16px;
    }

    .logo-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00f0ff, #ffd700, #00f0ff);
      animation: rotateBorder 3s linear infinite;
      z-index: 0;
    }

    .logo-ring::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00f0ff, #ffd700, #00f0ff);
      animation: rotateBorder 3s linear infinite;
      filter: blur(8px);
      opacity: 0.6;
      z-index: 0;
    }

    @keyframes rotateBorder {
      to { transform: rotate(360deg); }
    }

    .logo-img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #020617;
      box-shadow: 0 0 20px rgba(0,240,255,0.4), 0 0 40px rgba(255,215,0,0.15);
      animation: pulseLogo 3s ease-in-out infinite;
    }

    @keyframes pulseLogo {
      0%, 100% { box-shadow: 0 0 20px rgba(0,240,255,0.4), 0 0 40px rgba(255,215,0,0.15); }
      50%       { box-shadow: 0 0 30px rgba(0,240,255,0.7), 0 0 60px rgba(255,215,0,0.3); }
    }

    .logo-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f0ff 0%, #ffd700 50%, #00f0ff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .logo-sub {
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(0,240,255,0.5);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Form ── */
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      border-radius: 12px;
      border: 1px solid rgba(0,240,255,0.15);
      background: rgba(255,255,255,0.04);
      color: white;
      font-size: 14px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }

    input::placeholder { color: rgba(255,255,255,0.28); }

    input:focus {
      border-color: rgba(0,240,255,0.55);
      background: rgba(0,240,255,0.05);
      box-shadow: 0 0 0 3px rgba(0,240,255,0.1), 0 0 16px rgba(0,240,255,0.1);
    }

    input:focus + svg,
    .input-wrap:focus-within svg { opacity: 0.9; }

    /* ── Buttons ── */
    .btn-login {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #00c8e0 0%, #00f0ff 50%, #00c8e0 100%);
      background-size: 200% auto;
      color: #020617;
      transition: transform 0.15s, box-shadow 0.15s, background-position 0.4s;
      box-shadow: 0 0 20px rgba(0,240,255,0.35), 0 4px 16px rgba(0,0,0,0.3);
    }

    .btn-login:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0,240,255,0.55), 0 6px 20px rgba(0,0,0,0.4);
    }

    .btn-login:active { transform: translateY(0); }

    .btn-register {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid rgba(255,215,0,0.4);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(255,215,0,0.06);
      color: #ffd700;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s, border-color 0.2s;
      box-shadow: 0 0 12px rgba(255,215,0,0.1);
    }

    .btn-register:hover {
      background: rgba(255,215,0,0.12);
      border-color: rgba(255,215,0,0.7);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(255,215,0,0.3), 0 6px 20px rgba(0,0,0,0.4);
    }

    .btn-register:active { transform: translateY(0); }

    /* ripple */
    .btn-login::after, .btn-register::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      border-radius: inherit;
      transition: opacity 0.2s;
    }
    .btn-login:active::after, .btn-register:active::after { opacity: 1; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,0.2), transparent);
    }

    /* ── Neon scanline ── */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(90deg, transparent, #00f0ff, #ffd700, #00f0ff, transparent);
      opacity: 0.7;
      animation: scanTop 4s ease-in-out infinite alternate;
    }

    @keyframes scanTop {
      0%   { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* ── Mobile ── */
    @media (max-width: 400px) {
      .card { padding: 32px 24px 28px; }
      .logo-ring { width: 84px; height: 84px; }
      .logo-title { font-size: 24px; letter-spacing: 4px; }
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-ring">
      <img src="logoveltix.png" class="logo-img" alt="VELTIX">
    </div>
    <div class="logo-title">VELTIX</div>
    <div class="logo-sub">Tap · Earn · Conquer</div>
  </div>

  <form onsubmit="return false">
    <div class="input-wrap">
      <input id="email" type="email" placeholder="Email address" autocomplete="email">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    </div>

    <div class="input-wrap">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <div class="input-wrap">
      <input id="repeat" type="password" placeholder="Repeat Password" autocomplete="new-password">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <button class="btn-login" onclick="login()">⚡ Login</button>

    <div class="divider">or</div>

    <button class="btn-register" onclick="register()">✦ Create Account</button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCU5JdLURDc23XCZPZU49EIc_BdNgllsno",
  authDomain: "veltix-game.firebaseapp.com",
  projectId: "veltix-game"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔥 AUTO LOGIN
onAuthStateChanged(auth, (user) => {
  if (user && user.emailVerified) {
    window.location.href = "/index.html";
  }
});

// 🔑 LOGIN
window.login = function () {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then((cred) => {
      if (!cred.user.emailVerified) {
        alert("Email tasdiqlanmagan!");
        return;
      }
      window.location.href = "/index.html";
    })
    .catch(err => alert(err.message));
};

// 🆕 REGISTER
window.register = function () {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  let repeat = document.getElementById("repeat").value;

  if (password !== repeat) {
    alert("Parollar mos emas!");
    return;
  }

  createUserWithEmailAndPassword(auth, email, password)
    .then((cred) => {
      sendEmailVerification(cred.user);
      alert("Emailga tasdiqlash link yuborildi!");
    })
    .catch(err => alert(err.message));
};
</script>

</body>
</html>
