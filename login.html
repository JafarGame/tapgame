<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VELTIX Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020617;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ═══════════════════════════════
       BACKGROUND
    ═══════════════════════════════ */

    /* Hex dot grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(0,240,255,0.18) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
      animation: gridShift 20s linear infinite;
    }

    @keyframes gridShift {
      0%   { background-position: 0 0; }
      100% { background-position: 32px 32px; }
    }

    /* Deep colour gradient */
    .bg-color {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, #0b1f55 0%, transparent 65%),
        radial-gradient(ellipse 70% 50% at 90% 110%,  #1a0835 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 0%  90%,   #021830 0%, transparent 55%),
        #020617;
    }

    /* Ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      animation: orbDrift 10s ease-in-out infinite alternate;
    }
    .orb1 { width: 500px; height: 500px; background: #00d4ff; opacity: 0.10; top: -160px; left: -160px; animation-delay: 0s; }
    .orb2 { width: 380px; height: 380px; background: #ffc200; opacity: 0.09; bottom: -120px; right: -120px; animation-delay: -4s; }
    .orb3 { width: 250px; height: 250px; background: #6a00ff; opacity: 0.10; top: 40%; left: 55%; animation-delay: -7s; }

    @keyframes orbDrift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 25px) scale(1.12); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .p {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: #00f0ff;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    .p:nth-child(1)  { left:  8%; animation-duration: 9s;  animation-delay: 0s;   width:3px; height:3px; background:#ffd700; }
    .p:nth-child(2)  { left: 18%; animation-duration: 12s; animation-delay: 2s; }
    .p:nth-child(3)  { left: 28%; animation-duration: 8s;  animation-delay: 5s;   background:#ffd700; }
    .p:nth-child(4)  { left: 42%; animation-duration: 11s; animation-delay: 1s; }
    .p:nth-child(5)  { left: 55%; animation-duration: 7s;  animation-delay: 3.5s; background:#ffd700; width:3px; height:3px; }
    .p:nth-child(6)  { left: 67%; animation-duration: 13s; animation-delay: 0.5s; }
    .p:nth-child(7)  { left: 78%; animation-duration: 9s;  animation-delay: 4s;   background:#ffd700; }
    .p:nth-child(8)  { left: 88%; animation-duration: 10s; animation-delay: 6s; }
    .p:nth-child(9)  { left: 35%; animation-duration: 15s; animation-delay: 2.5s; width:3px; height:3px; }
    .p:nth-child(10) { left: 72%; animation-duration: 6s;  animation-delay: 1.5s; background:#ffd700; }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) translateX(0);    opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-10vh)  translateX(20px); opacity: 0; }
    }

    /* ═══════════════════════════════
       CARD
    ═══════════════════════════════ */
    .card {
      position: relative;
      z-index: 10;
      width: min(380px, 94vw);
      padding: 44px 38px 38px;
      border-radius: 28px;
      background: rgba(6, 12, 30, 0.88);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(0,240,255,0.16);
      box-shadow:
        0 0 0 1px rgba(0,240,255,0.05),
        0 0 80px rgba(0,240,255,0.07),
        0 0 40px rgba(255,215,0,0.04),
        0 20px 60px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,240,255,0.04);
      animation: cardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      /* subtle circuit pattern */
      background-image:
        linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.025) 1px, transparent 1px),
        linear-gradient(rgba(6,12,30,0.88), rgba(6,12,30,0.88));
      background-size: 40px 40px, 40px 40px, 100% 100%;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(36px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* Top neon bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #00f0ff 30%, #ffd700 70%, transparent);
      animation: barGlow 3s ease-in-out infinite alternate;
    }

    @keyframes barGlow {
      0%   { opacity: 0.5; filter: blur(0px); }
      100% { opacity: 1.0; filter: blur(1px); }
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 18px; height: 18px;
      border-color: rgba(0,240,255,0.45);
      border-style: solid;
    }
    .corner-tl { top: 12px; left: 12px;  border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
    .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
    .corner-bl { bottom: 12px; left: 12px;  border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
    .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

    /* ═══════════════════════════════
       LOGO COIN
    ═══════════════════════════════ */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    /* Outer ambient glow */
    .coin-glow {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 18px;
      filter: drop-shadow(0 0 18px rgba(0,240,255,0.5)) drop-shadow(0 0 36px rgba(255,215,0,0.25));
      animation: coinFloat 4s ease-in-out infinite;
    }

    @keyframes coinFloat {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-6px); }
    }

    /* Outermost ring — gold, slow */
    .ring-outer {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #7a5000, #ffd700, #ffe566, #ffd700, #b87c00, #ffd700, #7a5000
      );
      animation: spinCW 6s linear infinite;
    }
    /* Mask to thin ring */
    .ring-outer::after {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: rgba(6,12,30,0.88);
    }

    /* Middle ring — cyan, medium */
    .ring-mid {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg, #00f0ff 60deg, transparent 120deg,
        transparent 180deg, #00c8ff 240deg, transparent 300deg
      );
      animation: spinCCW 3s linear infinite;
    }
    .ring-mid::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: rgba(6,12,30,0.88);
    }

    /* Logo image — subtle coin tilt */
    .logo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,215,0,0.3);
      animation: coinTilt 6s ease-in-out infinite;
    }

    @keyframes spinCW  { to { transform: rotate(360deg);  } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    @keyframes coinTilt {
      0%   { transform: perspective(300px) rotateY(0deg)    scale(1); }
      25%  { transform: perspective(300px) rotateY(12deg)   scale(1.02); }
      50%  { transform: perspective(300px) rotateY(0deg)    scale(1); }
      75%  { transform: perspective(300px) rotateY(-12deg)  scale(1.02); }
      100% { transform: perspective(300px) rotateY(0deg)    scale(1); }
    }

    /* Online indicator */
    .status-dot {
      position: absolute;
      bottom: 4px; right: 4px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #00ff88;
      border: 2px solid rgba(6,12,30,0.9);
      box-shadow: 0 0 8px #00ff88;
      animation: dotPulse 2s ease-in-out infinite;
      z-index: 5;
    }

    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 6px #00ff88; }
      50%       { box-shadow: 0 0 14px #00ff88, 0 0 28px rgba(0,255,136,0.4); }
    }

    /* Title */
    .logo-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f0ff 0%, #ffe566 40%, #ffd700 60%, #00f0ff 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3.5s linear infinite;
      line-height: 1;
    }

    @keyframes shimmer { to { background-position: 250% center; } }

    .logo-sub {
      font-size: 10px;
      letter-spacing: 4px;
      color: rgba(0,240,255,0.45);
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ═══════════════════════════════
       FORM
    ═══════════════════════════════ */
    form { display: flex; flex-direction: column; gap: 11px; }

    .input-wrap { position: relative; }

    .input-wrap svg {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      width: 15px; height: 15px;
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .input-wrap:focus-within svg { opacity: 1; }

    input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border-radius: 12px;
      border: 1px solid rgba(0,240,255,0.13);
      background: rgba(0,240,255,0.03);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }

    input::placeholder { color: rgba(255,255,255,0.25); }

    input:focus {
      border-color: rgba(0,240,255,0.5);
      background: rgba(0,240,255,0.06);
      box-shadow: 0 0 0 3px rgba(0,240,255,0.08), 0 0 20px rgba(0,240,255,0.08);
    }

    /* ═══════════════════════════════
       BUTTONS
    ═══════════════════════════════ */
    .btn-login, .btn-register {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    /* Shine sweep on hover */
    .btn-login::before, .btn-register::before {
      content: '';
      position: absolute;
      top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transform: skewX(-20deg);
      transition: left 0.45s ease;
    }
    .btn-login:hover::before  { left: 125%; }
    .btn-register:hover::before { left: 125%; }

    .btn-login {
      background: linear-gradient(135deg, #00b8d9 0%, #00f0ff 50%, #00b8d9 100%);
      background-size: 200% auto;
      color: #020d1f;
      box-shadow: 0 0 24px rgba(0,240,255,0.4), 0 4px 20px rgba(0,0,0,0.35);
    }
    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(0,240,255,0.65), 0 8px 24px rgba(0,0,0,0.4);
    }
    .btn-login:active { transform: translateY(0); }

    .btn-register {
      background: linear-gradient(135deg, #1a1000 0%, #2a1e00 100%);
      color: #ffd700;
      border: 1px solid rgba(255,215,0,0.45);
      box-shadow: 0 0 16px rgba(255,215,0,0.15), 0 4px 20px rgba(0,0,0,0.35);
    }
    .btn-register:hover {
      background: linear-gradient(135deg, #2a1e00 0%, #3d2d00 100%);
      border-color: rgba(255,215,0,0.75);
      transform: translateY(-3px);
      box-shadow: 0 0 32px rgba(255,215,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
    }
    .btn-register:active { transform: translateY(0); }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 10px;
      color: rgba(255,255,255,0.18);
      font-size: 10px; letter-spacing: 2px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,0.18), transparent);
    }

    /* ═══════════════════════════════
       MOBILE
    ═══════════════════════════════ */
    @media (max-width: 400px) {
      .card         { padding: 36px 22px 28px; }
      .coin-glow    { width: 96px; height: 96px; }
      .logo-title   { font-size: 25px; letter-spacing: 6px; }
      .btn-login, .btn-register { padding: 13px; }
    }
  </style>
</head>
<body>

<!-- Background layers -->
<div class="bg-color"></div>
<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- Floating particles -->
<div class="particles">
  <div class="p"></div><div class="p"></div><div class="p"></div>
  <div class="p"></div><div class="p"></div><div class="p"></div>
  <div class="p"></div><div class="p"></div><div class="p"></div>
  <div class="p"></div>
</div>

<div class="card">
  <!-- Corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Coin logo -->
  <div class="logo-wrap">
    <div class="coin-glow">
      <div class="ring-outer"></div>
      <div class="ring-mid"></div>
      <img src="logoveltix.png" class="logo-img" alt="VELTIX">
      <div class="status-dot"></div>
    </div>
    <div class="logo-title">VELTIX</div>
    <div class="logo-sub">Tap &middot; Earn &middot; Conquer</div>
  </div>

  <form onsubmit="return false">
    <!-- Email -->
    <div class="input-wrap">
      <input id="email" type="email" placeholder="Email address" autocomplete="email">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    </div>

    <!-- Password -->
    <div class="input-wrap">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <!-- Repeat -->
    <div class="input-wrap">
      <input id="repeat" type="password" placeholder="Repeat Password" autocomplete="new-password">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <button class="btn-login" onclick="login()">&#9889; Login</button>

    <div class="divider">or</div>

    <button class="btn-register" onclick="register()">&#10022; Create Account</button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCU5JdLURDc23XCZPZU49EIc_BdNgllsno",
  authDomain: "veltix-game.firebaseapp.com",
  projectId: "veltix-game"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔥 AUTO LOGIN
onAuthStateChanged(auth, (user) => {
  if (user && user.emailVerified) {
    window.location.href = "/index.html";
  }
});

// 🔑 LOGIN
window.login = function () {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then((cred) => {
      if (!cred.user.emailVerified) {
        alert("Email tasdiqlanmagan!");
        return;
      }
      window.location.href = "/index.html";
    })
    .catch(err => alert(err.message));
};

// 🆕 REGISTER
window.register = function () {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  let repeat = document.getElementById("repeat").value;

  if (password !== repeat) {
    alert("Parollar mos emas!");
    return;
  }

  createUserWithEmailAndPassword(auth, email, password)
    .then((cred) => {
      sendEmailVerification(cred.user);
      alert("Emailga tasdiqlash link yuborildi!");
    })
    .catch(err => alert(err.message));
};
</script>

</body>
</html>
