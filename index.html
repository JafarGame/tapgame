<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELTIX Game</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #020617;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ═══════════════════════════════
       BACKGROUND
    ═══════════════════════════════ */
    .bg-color {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 0%,   #0b1f55 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 90% 100%,  #1a0835 0%, transparent 60%),
        #020617;
    }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(0,240,255,0.14) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 20%, transparent 100%);
      animation: gridDrift 25s linear infinite;
    }

    @keyframes gridDrift {
      to { background-position: 34px 34px; }
    }

    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(90px); pointer-events: none;
      animation: orbDrift 10s ease-in-out infinite alternate;
    }
    .orb1 { width:460px; height:460px; background:#00d4ff; opacity:.09; top:-150px; left:-150px; }
    .orb2 { width:360px; height:360px; background:#ffc200; opacity:.08; bottom:-120px; right:-120px; animation-delay:-4s; }
    .orb3 { width:240px; height:240px; background:#6a00ff; opacity:.09; top:40%; left:55%; animation-delay:-7s; }

    @keyframes orbDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(35px,20px) scale(1.1); }
    }

    /* ═══════════════════════════════
       LOADER
    ═══════════════════════════════ */
    #loader {
      position: fixed; inset: 0; z-index: 999;
      background: #020617;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 24px;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loader-ring {
      position: relative; width: 90px; height: 90px;
    }
    .loader-ring::before {
      content:''; position:absolute; inset:-4px; border-radius:50%;
      background: conic-gradient(from 0deg, #00f0ff, #ffd700, #00f0ff);
      animation: spinCW 1.5s linear infinite;
    }
    .loader-ring::after {
      content:''; position:absolute; inset:-4px; border-radius:50%;
      background: conic-gradient(from 0deg, #00f0ff, #ffd700, #00f0ff);
      animation: spinCW 1.5s linear infinite;
      filter: blur(8px); opacity:.5;
    }
    .loader-logo {
      position:relative; z-index:1;
      width:82px; height:82px; border-radius:50%;
      object-fit:cover; border:3px solid #020617; display:block; margin:0 auto;
    }
    .loader-text {
      font-size:13px; letter-spacing:3px; text-transform:uppercase;
      color:rgba(0,240,255,.6); animation: txtPulse 1.5s ease-in-out infinite;
    }
    @keyframes txtPulse { 0%,100%{opacity:.4} 50%{opacity:1} }

    /* ═══════════════════════════════
       GAME WRAPPER
    ═══════════════════════════════ */
    #game {
      position: relative; z-index: 10;
      width: 100%; max-width: 460px;
      padding: 28px 20px 50px;
      display: flex; flex-direction: column; align-items: center;
      opacity: 0; transition: opacity .5s ease;
    }
    #game.visible { opacity: 1; }

    /* ── Header ── */
    .game-title {
      font-size: 28px; font-weight: 900; letter-spacing: 7px;
      background: linear-gradient(90deg, #00f0ff, #ffe566, #ffd700, #00f0ff);
      background-size: 250% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: shimmer 3.5s linear infinite;
      margin-bottom: 2px;
    }
    @keyframes shimmer { to { background-position: 250% center; } }

    #userName {
      font-size: 11px; letter-spacing: 1.5px;
      color: rgba(0,240,255,.4); margin-bottom: 20px;
    }

    /* ── Stats ── */
    .stats {
      display: inline-flex; gap: 0;
      background: rgba(6,12,30,.8);
      border: 1px solid rgba(0,240,255,.14);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 30px;
      box-shadow: 0 0 30px rgba(0,240,255,.06), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .stat {
      display: flex; flex-direction: column; align-items: center;
      padding: 14px 34px; gap: 3px;
    }
    .stat + .stat { border-left: 1px solid rgba(0,240,255,.1); }
    .stat-val {
      font-size: 34px; font-weight: 900; line-height: 1;
      color: #ffd700;
      text-shadow: 0 0 14px rgba(255,215,0,.6);
      transition: transform .15s ease;
    }
    .stat-val.pop { animation: statPop .25s ease; }
    @keyframes statPop { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
    .stat-label {
      font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(255,255,255,.3);
    }

    /* ═══════════════════════════════
       3-D COIN
    ═══════════════════════════════ */
    .coin-zone {
      position: relative;
      display: flex; justify-content: center; align-items: center;
      width: 220px; height: 220px;
      margin-bottom: 36px;
      cursor: pointer;
    }

    /* Ambient halo behind everything */
    .coin-halo {
      position: absolute; inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,240,255,.18) 0%, rgba(255,215,0,.08) 50%, transparent 70%);
      animation: haloBreath 3s ease-in-out infinite;
    }
    @keyframes haloBreath {
      0%,100% { transform: scale(1);   opacity: .6; }
      50%      { transform: scale(1.1); opacity: 1; }
    }

    /* Outer gold ring */
    .ring-outer {
      position: absolute; inset: -10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #5a3800, #ffd700, #ffe98a, #ffd700, #9a6200, #ffd700, #5a3800);
      animation: spinCW 7s linear infinite;
    }
    .ring-outer::after {
      content:''; position:absolute; inset:6px;
      border-radius:50%; background:#020617;
    }

    /* Middle cyan ring */
    .ring-mid {
      position: absolute; inset: -2px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg, #00f0ff 55deg, rgba(0,240,255,.2) 90deg, transparent 110deg,
        transparent 180deg, #00c8ff 235deg, rgba(0,200,255,.2) 270deg, transparent 290deg
      );
      animation: spinCCW 3s linear infinite;
    }
    .ring-mid::after {
      content:''; position:absolute; inset:5px;
      border-radius:50%; background:#020617;
    }

    /* Inner glow ring */
    .ring-inner {
      position: absolute; inset: 3px;
      border-radius: 50%;
      border: 1px solid rgba(255,215,0,.25);
      box-shadow: inset 0 0 20px rgba(255,215,0,.08);
    }

    /* The actual logo */
    .coin-img {
      position: absolute; inset: 8px;
      width: calc(100% - 16px); height: calc(100% - 16px);
      border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(255,215,0,.3);
      box-shadow: 0 0 20px rgba(0,240,255,.35), 0 0 40px rgba(255,215,0,.15);
      animation: coinFloat 3.5s ease-in-out infinite, coinTilt 7s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes coinFloat {
      0%,100% { transform: translateY(0)   perspective(400px) rotateY(0deg); }
      50%      { transform: translateY(-8px) perspective(400px) rotateY(0deg); }
    }

    @keyframes coinTilt {
      0%,100% { filter: brightness(1)    drop-shadow(0 0 12px rgba(0,240,255,.5)); }
      25%      { filter: brightness(1.15) drop-shadow(4px 0 18px rgba(0,240,255,.7)); }
      75%      { filter: brightness(1.15) drop-shadow(-4px 0 18px rgba(255,215,0,.5)); }
    }

    /* Tap bounce — toggled by JS */
    .coin-zone.tapped .coin-img {
      animation: coinBounce .35s cubic-bezier(.36,.07,.19,.97) both,
                 coinTilt 7s ease-in-out infinite;
    }
    @keyframes coinBounce {
      0%  { transform: scale(1); }
      30% { transform: scale(.88) rotate(-3deg); }
      60% { transform: scale(1.1)  rotate(2deg); }
      80% { transform: scale(.96); }
      100%{ transform: scale(1); }
    }

    /* Pulse ring that fires on tap */
    .coin-pulse {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(0,240,255,.7);
      opacity: 0; pointer-events: none;
    }
    .coin-zone.tapped .coin-pulse {
      animation: pulseRing .5s ease-out forwards;
    }
    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: .8; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* ═══════════════════════════════
       PREMIUM TAP BUTTON
    ═══════════════════════════════ */
    .tap-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Animated glow ring around button */
    .tap-glow-ring {
      position: absolute;
      inset: -8px;
      border-radius: 60px;
      background: conic-gradient(from 0deg, #00f0ff, #ffd700, #00f0ff);
      animation: spinCW 3s linear infinite;
      filter: blur(6px);
      opacity: .55;
      pointer-events: none;
    }

    #tapBtn {
      position: relative;
      z-index: 1;
      padding: 20px 56px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #020617;
      background: linear-gradient(135deg, #00b8d9 0%, #00f0ff 45%, #00e5f5 55%, #00b8d9 100%);
      background-size: 200% auto;
      box-shadow:
        0 0 30px rgba(0,240,255,.55),
        0 0 60px rgba(0,240,255,.2),
        0 6px 30px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.4),
        inset 0 -2px 0 rgba(0,0,0,.2);
      transition: transform .12s ease, box-shadow .15s ease, background-position .4s ease;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Shine sweep */
    #tapBtn::before {
      content: '';
      position: absolute; top: 0; left: -80%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
      transform: skewX(-20deg);
      animation: btnShine 2.5s ease-in-out infinite;
    }
    @keyframes btnShine {
      0%   { left: -80%; }
      50%  { left: 120%; }
      100% { left: 120%; }
    }

    #tapBtn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 50px rgba(0,240,255,.75), 0 0 90px rgba(0,240,255,.25), 0 10px 40px rgba(0,0,0,.5);
      background-position: right center;
    }
    #tapBtn:active {
      transform: scale(.94) translateY(2px);
      box-shadow: 0 0 20px rgba(0,240,255,.4), 0 2px 10px rgba(0,0,0,.5);
    }

    /* ── Secondary buttons ── */
    .btn-row {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }

    #upgradeBtn {
      padding: 13px 28px;
      border-radius: 14px; border: 1px solid rgba(255,215,0,.4);
      background: rgba(255,215,0,.07);
      color: #ffd700;
      font-size: 14px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255,215,0,.12);
      transition: transform .15s, box-shadow .15s, background .15s;
      touch-action: manipulation;
      overflow: hidden; position: relative;
    }
    #upgradeBtn::before {
      content:''; position:absolute; top:0; left:-70%;
      width:50%; height:100%;
      background: linear-gradient(90deg, transparent, rgba(255,215,0,.18), transparent);
      transform: skewX(-20deg); transition: left .4s ease;
    }
    #upgradeBtn:hover::before { left:120%; }
    #upgradeBtn:hover {
      background: rgba(255,215,0,.14); border-color: rgba(255,215,0,.7);
      transform: translateY(-2px); box-shadow: 0 0 28px rgba(255,215,0,.3);
    }
    #upgradeBtn:active { transform: scale(.95); }

    #logoutBtn {
      padding: 13px 20px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.35);
      font-size: 12px; font-weight: 600; letter-spacing: 1px;
      cursor: pointer;
      transition: color .2s, background .2s, transform .15s;
      touch-action: manipulation;
    }
    #logoutBtn:hover { color: rgba(255,255,255,.65); background: rgba(255,255,255,.08); transform: translateY(-1px); }
    #logoutBtn:active { transform: scale(.95); }

    /* ═══════════════════════════════
       TAP EFFECTS (floating coins & particles)
    ═══════════════════════════════ */

    /* Floating mini-coin on tap */
    .floatCoin {
      position: fixed;
      width: 28px; height: 28px;
      border-radius: 50%; object-fit: cover;
      pointer-events: none;
      box-shadow: 0 0 8px gold, 0 0 18px rgba(255,165,0,.6);
      animation: floatCoinUp 1.1s cubic-bezier(.25,.46,.45,.94) forwards;
      transform-origin: center;
    }
    @keyframes floatCoinUp {
      0%   { transform: translateY(0) scale(1) rotate(0deg);        opacity: 1; }
      60%  { opacity: 1; }
      100% { transform: translateY(-110px) scale(.35) rotate(360deg); opacity: 0; }
    }

    /* +N text */
    .plusEffect {
      position: fixed;
      font-weight: 900; font-size: 22px;
      pointer-events: none;
      text-shadow: 0 0 10px #ffd700, 0 0 20px rgba(255,215,0,.5);
      color: #ffe566;
      animation: plusFly 1s ease-out forwards;
      white-space: nowrap;
    }
    @keyframes plusFly {
      0%   { transform: translateY(0) scale(1);    opacity: 1; }
      30%  { transform: translateY(-20px) scale(1.2); opacity: 1; }
      100% { transform: translateY(-80px) scale(.8);  opacity: 0; }
    }

    /* Spark particle */
    .spark {
      position: fixed;
      width: 5px; height: 5px;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkFly var(--dur) ease-out forwards;
    }
    @keyframes sparkFly {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* Ripple from tap point */
    .tapRipple {
      position: fixed;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(0,240,255,.8);
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: rippleOut .6s ease-out forwards;
    }
    @keyframes rippleOut {
      0%   { transform: translate(-50%,-50%) scale(1);   opacity: .9; }
      100% { transform: translate(-50%,-50%) scale(5);   opacity: 0; }
    }

    /* ── Shared keyframes ── */
    @keyframes spinCW  { to { transform: rotate(360deg);  } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    /* ═══════════════════════════════
       MOBILE
    ═══════════════════════════════ */
    @media (max-width: 420px) {
      .coin-zone { width: 185px; height: 185px; }
      .stat-val  { font-size: 28px; }
      .stat      { padding: 12px 24px; }
      #tapBtn    { padding: 18px 44px; font-size: 19px; }
    }
  </style>
</head>
<body>

<div class="bg-color"></div>
<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- Loader -->
<div id="loader">
  <div class="loader-ring">
    <img src="logoveltix.png" class="loader-logo" alt="VELTIX">
  </div>
  <div class="loader-text">Loading session…</div>
</div>

<!-- Game -->
<div id="game">
  <div class="game-title">VELTIX</div>
  <p id="userName"></p>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="coin">0</div>
      <div class="stat-label">Coins</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="level">1</div>
      <div class="stat-label">Level</div>
    </div>
  </div>

  <!-- 3-D Coin (also tappable) -->
  <div class="coin-zone" id="coinZone" onclick="tap(event)" ontouchstart="tap(event)">
    <div class="coin-halo"></div>
    <div class="ring-outer"></div>
    <div class="ring-mid"></div>
    <div class="ring-inner"></div>
    <img src="logoveltix.png" class="coin-img" alt="VELTIX" draggable="false">
    <div class="coin-pulse" id="coinPulse"></div>
  </div>

  <!-- Premium TAP button -->
  <div class="tap-wrapper">
    <div class="tap-glow-ring"></div>
    <button id="tapBtn" onclick="tap(event)" ontouchstart="tap(event)">&#9889; TAP</button>
  </div>

  <!-- Secondary -->
  <div class="btn-row">
    <button id="upgradeBtn" onclick="upgrade()">&#9650; Upgrade</button>
    <button id="logoutBtn"  onclick="logout()">Logout</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCU5JdLURDc23XCZPZU49EIc_BdNgllsno",
  authDomain: "veltix-game.firebaseapp.com",
  projectId: "veltix-game"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ─────────────────────────────────
// Visual helpers
// ─────────────────────────────────
const SPARK_COLORS = ['#00f0ff','#ffd700','#ffffff','#ff9900','#00ff88'];

function spawnSparks(x, y, count = 10) {
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'spark';
    const angle  = (360 / count) * i + Math.random() * 20;
    const dist   = 40 + Math.random() * 60;
    const rad    = angle * Math.PI / 180;
    el.style.setProperty('--tx', (Math.cos(rad) * dist) + 'px');
    el.style.setProperty('--ty', (Math.sin(rad) * dist) + 'px');
    el.style.setProperty('--dur', (.4 + Math.random() * .5) + 's');
    el.style.left    = x + 'px';
    el.style.top     = y + 'px';
    el.style.background = SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)];
    el.style.boxShadow  = `0 0 6px ${el.style.background}`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
}

function spawnRipple(x, y) {
  const el = document.createElement('div');
  el.className = 'tapRipple';
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

function bounceCoin() {
  const zone = document.getElementById('coinZone');
  zone.classList.remove('tapped');
  void zone.offsetWidth; // reflow to restart animation
  zone.classList.add('tapped');
  setTimeout(() => zone.classList.remove('tapped'), 400);
}

function popStat(id) {
  const el = document.getElementById(id);
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 300);
}

// ─────────────────────────────────
// 🔐 LOGIN CHECK
// ─────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (!user || !user.emailVerified) {
    window.location.href = "/login.html";
    return;
  }

  document.getElementById("userName").innerText = user.email;
  await startGame(user);

  // Fade loader out, fade game in
  const loader = document.getElementById("loader");
  const game   = document.getElementById("game");
  loader.classList.add("hidden");
  game.classList.add("visible");
});

// ─────────────────────────────────
// 🎮 GAME
// ─────────────────────────────────
async function startGame(user) {
  const uid     = user.uid;
  const userRef = doc(db, "players", uid);

  // Load progress from Firestore
  let coin  = 0;
  let level = 1;
  try {
    const snap = await getDoc(userRef);
    if (snap.exists()) {
      const data = snap.data();
      coin  = data.coin  ?? 0;
      level = data.level ?? 1;
    }
  } catch (e) {
    console.error("Failed to load progress:", e);
  }

  function update() {
    document.getElementById("coin").innerText  = coin;
    document.getElementById("level").innerText = level;
  }

  function save() {
    setDoc(userRef, { coin, level }, { merge: true }).catch(e => {
      console.error("Failed to save progress:", e);
    });
  }

  // Prevent double-fire from touch + click on mobile
  let lastTap = 0;

  window.tap = function(event) {
    event.preventDefault();
    const now = Date.now();
    if (now - lastTap < 80) return; // debounce
    lastTap = now;

    const tapCoin = Math.floor((level - 1) / 10) + 1;
    coin += tapCoin;
    update();
    save();

    // Coordinates — handle both mouse and touch
    let x, y;
    if (event.touches && event.touches.length) {
      x = event.touches[0].clientX;
      y = event.touches[0].clientY;
    } else {
      x = event.clientX;
      y = event.clientY;
    }

    // Coin bounce + pulse ring
    bounceCoin();

    // Stat pop
    popStat('coin');

    // Ripple at tap point
    spawnRipple(x, y);

    // Sparks
    spawnSparks(x, y, 10);

    // Floating mini-coin image
    const coinImg = document.createElement("img");
    coinImg.src = "logoveltix.png";
    coinImg.className = "floatCoin";
    coinImg.style.left = (x - 14) + "px";
    coinImg.style.top  = (y - 14) + "px";
    document.body.appendChild(coinImg);
    setTimeout(() => coinImg.remove(), 1100);

    // +N label — offset slightly so it doesn't overlap the coin image
    const plus = document.createElement("div");
    plus.innerText  = "+" + tapCoin;
    plus.className  = "plusEffect";
    plus.style.left = (x + 18) + "px";
    plus.style.top  = (y - 10) + "px";
    document.body.appendChild(plus);
    setTimeout(() => plus.remove(), 1000);
  };

  window.upgrade = function() {
    if (coin >= 10) {
      coin -= 10;
      level++;
      save();
      update();
      popStat('level');
    } else {
      alert("Coin yetarli emas!");
    }
  };

  update();
}

// ─────────────────────────────────
// 🚪 LOGOUT
// ─────────────────────────────────
window.logout = function() {
  signOut(auth).then(() => {
    window.location.href = "/login.html";
  });
};
</script>
