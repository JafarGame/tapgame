<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VELTIX Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:    #00f0ff;
      --gold:    #ffd700;
      --green:   #00ff88;
      --dark:    #020714;
      --card-bg: rgba(4, 10, 28, 0.88);
      --nav-h:   68px;
      --hdr-h:   68px;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: #fff;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ══════════════════════════════════
       BACKGROUND
    ══════════════════════════════════ */
    .bg-space {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 110% 65% at 50% -5%, #06184a 0%, transparent 60%),
        radial-gradient(ellipse 65%  50% at 96% 105%,#1a0535 0%, transparent 55%),
        radial-gradient(ellipse 55%  45% at -5% 85%, #011e38 0%, transparent 50%),
        #020714;
    }
    .bg-hex {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: radial-gradient(circle, rgba(0,240,255,0.12) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 10%, transparent 100%);
      animation: hexScroll 20s linear infinite;
    }
    @keyframes hexScroll { to { background-position: 36px 36px; } }
    .bg-scan {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,240,255,0.01) 3px, rgba(0,240,255,0.01) 4px
      );
    }
    .orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
      filter: blur(110px); animation: orbDrift 14s ease-in-out infinite alternate;
    }
    .orb1 { width:550px; height:550px; background:#00cfff; opacity:.07; top:-180px; left:-160px; }
    .orb2 { width:400px; height:400px; background:#ffc200; opacity:.06; bottom:-130px; right:-130px; animation-delay:-6s; }
    .orb3 { width:260px; height:260px; background:#6800ff; opacity:.08; top:38%; left:60%; animation-delay:-10s; }
    @keyframes orbDrift { from{transform:translate(0,0) scale(1);} to{transform:translate(45px,28px) scale(1.14);} }

    /* floating particles */
    .particles { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
    .p { position:absolute; border-radius:50%; opacity:0; animation:floatUp linear infinite; }
    .p:nth-child(1)  { left:4%;  width:3px;height:3px; background:var(--gold); animation-duration:10s; animation-delay:0s; }
    .p:nth-child(2)  { left:14%; width:2px;height:2px; background:var(--cyan); animation-duration:13s; animation-delay:2.5s; }
    .p:nth-child(3)  { left:24%; width:2px;height:2px; background:var(--gold); animation-duration: 8s; animation-delay:5s; }
    .p:nth-child(4)  { left:37%; width:2px;height:2px; background:var(--cyan); animation-duration:11s; animation-delay:1s; }
    .p:nth-child(5)  { left:50%; width:3px;height:3px; background:var(--gold); animation-duration: 7s; animation-delay:3s; }
    .p:nth-child(6)  { left:63%; width:2px;height:2px; background:var(--cyan); animation-duration:14s; animation-delay:0.5s; }
    .p:nth-child(7)  { left:76%; width:2px;height:2px; background:var(--gold); animation-duration: 9s; animation-delay:4.5s; }
    .p:nth-child(8)  { left:88%; width:2px;height:2px; background:var(--cyan); animation-duration:11s; animation-delay:7s; }
    @keyframes floatUp {
      0%   { transform:translateY(108vh); opacity:0; }
      8%   { opacity:0.7; }
      92%  { opacity:0.35; }
      100% { transform:translateY(-8vh) translateX(20px); opacity:0; }
    }

    /* ══════════════════════════════════
       LOADER
    ══════════════════════════════════ */
    #loader {
      position:fixed; inset:0; z-index:999;
      background:var(--dark);
      display:flex; flex-direction:column;
      justify-content:center; align-items:center; gap:20px;
      transition:opacity .5s ease, visibility .5s ease;
    }
    #loader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .loader-ring {
      position:relative; width:88px; height:88px;
    }
    .loader-ring::before {
      content:''; position:absolute; inset:-4px; border-radius:50%;
      background:conic-gradient(from 0deg, var(--cyan), var(--gold), var(--cyan));
      animation:spinCW 1.4s linear infinite;
    }
    .loader-ring::after {
      content:''; position:absolute; inset:-4px; border-radius:50%;
      background:conic-gradient(from 0deg, var(--cyan), var(--gold), var(--cyan));
      animation:spinCW 1.4s linear infinite;
      filter:blur(8px); opacity:.5;
    }
    .loader-logo {
      position:relative; z-index:1;
      width:80px; height:80px; border-radius:50%;
      object-fit:cover; border:3px solid var(--dark);
      display:block; margin:0 auto;
    }
    .loader-text {
      font-family:'Orbitron',sans-serif;
      font-size:11px; letter-spacing:3px; text-transform:uppercase;
      color:rgba(0,240,255,.55); animation:txtPulse 1.4s ease-in-out infinite;
    }
    @keyframes txtPulse { 0%,100%{opacity:.35;} 50%{opacity:1;} }

    /* ══════════════════════════════════
       MAIN LAYOUT
    ══════════════════════════════════ */
    #app {
      position:fixed; inset:0; z-index:10;
      display:flex; flex-direction:column;
      opacity:0; transition:opacity .5s ease;
    }
    #app.visible { opacity:1; }

    /* ══════════════════════════════════
       HEADER
    ══════════════════════════════════ */
    header {
      position:relative; z-index:20;
      height:var(--hdr-h);
      display:flex; align-items:center;
      padding:0 18px;
      background:rgba(2,7,20,0.85);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(0,240,255,0.1);
      flex-shrink:0;
    }
    /* Neon bottom line on header */
    header::after {
      content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
      background:linear-gradient(90deg, transparent, var(--cyan) 30%, var(--gold) 70%, transparent);
      opacity:.4;
    }

    .hdr-logo {
      display:flex; align-items:center; gap:10px; text-decoration:none;
    }
    .hdr-coin {
      width:38px; height:38px; position:relative; flex-shrink:0;
      filter:drop-shadow(0 0 8px rgba(0,240,255,.55)) drop-shadow(0 0 16px rgba(255,215,0,.3));
    }
    .hdr-coin .r1 {
      position:absolute; inset:-5px; border-radius:50%;
      background:conic-gradient(from 0deg, #5a3800, #ffd700, #ffe87a, #ffd700, #5a3800);
      animation:spinCW 6s linear infinite;
    }
    .hdr-coin .r1::after {
      content:''; position:absolute; inset:4px; border-radius:50%;
      background:var(--dark);
    }
    .hdr-coin .r2 {
      position:absolute; inset:-1px; border-radius:50%;
      background:conic-gradient(from 0deg, transparent 0deg, var(--cyan) 60deg, transparent 120deg, transparent 240deg, var(--cyan) 300deg, transparent 360deg);
      animation:spinCCW 3s linear infinite;
    }
    .hdr-coin .r2::after {
      content:''; position:absolute; inset:3px; border-radius:50%;
      background:var(--dark);
    }
    .hdr-coin img {
      position:absolute; inset:0; width:100%; height:100%;
      border-radius:50%; object-fit:cover;
    }
    .hdr-title {
      font-family:'Orbitron',sans-serif;
      font-size:18px; font-weight:900; letter-spacing:5px;
      background:linear-gradient(90deg, var(--cyan) 0%, var(--gold) 50%, var(--cyan) 100%);
      background-size:220% auto;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      animation:shimmer 3s linear infinite;
    }
    @keyframes shimmer { to { background-position:220% center; } }

    /* User area — right side of header */
    .hdr-user {
      margin-left:auto;
      display:flex; align-items:center; gap:10px;
    }
    .hdr-nick {
      text-align:right;
    }
    .hdr-nick-name {
      font-family:'Orbitron',sans-serif;
      font-size:11px; font-weight:700; letter-spacing:1.5px;
      color:#fff; line-height:1;
    }
    .hdr-nick-sub {
      font-size:10px; letter-spacing:2px; color:rgba(0,240,255,.38);
      text-transform:uppercase; margin-top:2px;
    }
    /* Level badge */
    .level-badge {
      display:inline-flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg, #1c1200, #2e2000);
      border:1px solid rgba(255,215,0,.45);
      border-radius:8px; padding:2px 7px;
      font-family:'Orbitron',sans-serif;
      font-size:9px; font-weight:700; letter-spacing:1px;
      color:var(--gold);
      box-shadow:0 0 10px rgba(255,215,0,.18);
      margin-top:3px;
    }
    /* Avatar circle */
    .avatar {
      width:40px; height:40px; border-radius:50%;
      background:linear-gradient(135deg, rgba(0,240,255,.15), rgba(255,215,0,.1));
      border:2px solid rgba(0,240,255,.35);
      display:flex; align-items:center; justify-content:center;
      font-family:'Orbitron',sans-serif;
      font-size:15px; font-weight:900;
      color:var(--cyan);
      box-shadow:0 0 14px rgba(0,240,255,.25);
      flex-shrink:0; cursor:pointer;
      transition:box-shadow .2s;
    }
    .avatar:hover { box-shadow:0 0 24px rgba(0,240,255,.5); }

    /* ══════════════════════════════════
       STATS BAR
    ══════════════════════════════════ */
    .stats-bar {
      display:flex; gap:10px;
      padding:14px 16px 0;
      flex-shrink:0;
    }
    .stat-pill {
      flex:1; display:flex; align-items:center; gap:10px;
      padding:10px 14px;
      background:var(--card-bg);
      border-radius:16px;
      border:1px solid rgba(0,240,255,.1);
      backdrop-filter:blur(16px);
      box-shadow:0 0 20px rgba(0,240,255,.04), inset 0 1px 0 rgba(255,255,255,.04);
      min-width:0;
    }
    .stat-pill.gold-pill {
      border-color:rgba(255,215,0,.14);
      box-shadow:0 0 20px rgba(255,215,0,.04), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .stat-pill.green-pill {
      border-color:rgba(0,255,136,.12);
      box-shadow:0 0 20px rgba(0,255,136,.04), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .stat-icon {
      font-size:18px; line-height:1; flex-shrink:0;
    }
    .stat-info { min-width:0; flex:1; }
    .stat-val {
      font-family:'Orbitron',sans-serif;
      font-size:16px; font-weight:900; line-height:1;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      transition:transform .15s;
    }
    .stat-val.gold-val  { color:var(--gold);  text-shadow:0 0 10px rgba(255,215,0,.5); }
    .stat-val.cyan-val  { color:var(--cyan);  text-shadow:0 0 10px rgba(0,240,255,.5); }
    .stat-val.green-val { color:var(--green); text-shadow:0 0 10px rgba(0,255,136,.5); }
    .stat-val.pop { animation:statPop .25s ease; }
    @keyframes statPop { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
    .stat-lbl {
      font-size:9px; letter-spacing:2px; text-transform:uppercase;
      color:rgba(255,255,255,.28); margin-top:2px;
    }

    /* ══════════════════════════════════
       SCROLL CONTENT AREA
    ══════════════════════════════════ */
    .content {
      flex:1; overflow-y:auto; overflow-x:hidden;
      display:flex; flex-direction:column; align-items:center;
      padding:20px 16px calc(var(--nav-h) + 20px);
      scrollbar-width:none;
    }
    .content::-webkit-scrollbar { display:none; }

    /* ══════════════════════════════════
       COIN ZONE
    ══════════════════════════════════ */
    .coin-section {
      display:flex; flex-direction:column; align-items:center;
      width:100%; max-width:340px;
      margin-bottom:24px;
    }

    .coin-zone {
      position:relative;
      display:flex; justify-content:center; align-items:center;
      width:240px; height:240px;
      cursor:pointer; touch-action:manipulation;
      margin-bottom:20px;
    }

    /* Ambient glow behind coin */
    .coin-aura {
      position:absolute; inset:-28px; border-radius:50%;
      background:radial-gradient(circle, rgba(0,240,255,.16) 0%, rgba(255,215,0,.08) 45%, transparent 70%);
      animation:auraBreath 3.5s ease-in-out infinite;
    }
    @keyframes auraBreath {
      0%,100% { transform:scale(1);   opacity:.6; }
      50%      { transform:scale(1.1); opacity:1; }
    }

    /* Outermost gold ring */
    .ring-outer {
      position:absolute; inset:-14px; border-radius:50%;
      background:conic-gradient(from 0deg, #5a3800, #ffd700, #ffe98a, #ffd700, #9a6200, #ffd700, #5a3800);
      animation:spinCW 8s linear infinite;
    }
    .ring-outer::after {
      content:''; position:absolute; inset:7px;
      border-radius:50%; background:#020714;
    }

    /* Mid cyan dashes ring */
    .ring-mid {
      position:absolute; inset:-3px; border-radius:50%;
      background:conic-gradient(
        from 0deg,
        transparent 0deg,   var(--cyan)    55deg, rgba(0,240,255,.2) 90deg,  transparent 110deg,
        transparent 180deg, #00c8ff       235deg, rgba(0,200,255,.2) 270deg, transparent 290deg
      );
      animation:spinCCW 3.2s linear infinite;
    }
    .ring-mid::after {
      content:''; position:absolute; inset:5px;
      border-radius:50%; background:#020714;
    }

    /* Inner shimmer ring */
    .ring-inner {
      position:absolute; inset:4px; border-radius:50%;
      background:conic-gradient(
        from 0deg,
        transparent 0deg, rgba(255,255,255,.22) 30deg, transparent 60deg,
        transparent 180deg, rgba(0,240,255,.18) 210deg, transparent 240deg
      );
      animation:spinCW 2.2s linear infinite;
    }
    .ring-inner::after {
      content:''; position:absolute; inset:5px;
      border-radius:50%; background:#020714;
    }

    /* Coin image */
    .coin-img {
      position:absolute; inset:10px;
      width:calc(100% - 20px); height:calc(100% - 20px);
      border-radius:50%; object-fit:cover;
      border:2px solid rgba(255,215,0,.32);
      box-shadow:
        0 0 22px rgba(0,240,255,.38),
        0 0 44px rgba(255,215,0,.16),
        inset 0 0 18px rgba(0,0,0,.4);
      animation:coinFloat 3.8s ease-in-out infinite, coinShimmer 8s ease-in-out infinite;
    }
    @keyframes coinFloat {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-10px); }
    }
    @keyframes coinShimmer {
      0%,100% { filter:brightness(1) drop-shadow(0 0 12px rgba(0,240,255,.5)); }
      25%      { filter:brightness(1.18) drop-shadow(5px 0 20px rgba(0,240,255,.75)); }
      75%      { filter:brightness(1.18) drop-shadow(-5px 0 20px rgba(255,215,0,.55)); }
    }

    /* Tap bounce — toggled by JS */
    .coin-zone.tapped .coin-img {
      animation:coinBounce .35s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes coinBounce {
      0%  { transform:scale(1); }
      25% { transform:scale(.86) rotate(-4deg); }
      55% { transform:scale(1.12) rotate(2deg); }
      80% { transform:scale(.97); }
      100%{ transform:scale(1); }
    }

    /* Pulse ring on tap */
    .coin-pulse {
      position:absolute; inset:0; border-radius:50%;
      border:2px solid rgba(0,240,255,.75);
      opacity:0; pointer-events:none;
    }
    .coin-zone.tapped .coin-pulse {
      animation:pulseRing .55s ease-out forwards;
    }
    @keyframes pulseRing {
      0%   { transform:scale(1);    opacity:.85; }
      100% { transform:scale(1.65); opacity:0; }
    }

    /* "No energy" shake */
    .coin-zone.no-energy {
      animation:shake .35s ease;
    }
    @keyframes shake {
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-6px);}
      40%{transform:translateX(6px);}
      60%{transform:translateX(-4px);}
      80%{transform:translateX(4px);}
    }

    /* TAP hint */
    .tap-hint {
      font-family:'Orbitron',sans-serif;
      font-size:10px; letter-spacing:4px; text-transform:uppercase;
      color:rgba(0,240,255,.32);
      animation:hintPulse 2s ease-in-out infinite;
      margin-bottom:20px;
    }
    @keyframes hintPulse { 0%,100%{opacity:.32;} 50%{opacity:.7;} }

    /* ══════════════════════════════════
       ENERGY BAR
    ══════════════════════════════════ */
    .energy-section {
      width:100%; max-width:340px;
      margin-bottom:24px;
    }
    .energy-header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:8px;
    }
    .energy-label {
      font-size:10px; letter-spacing:3px; text-transform:uppercase;
      color:rgba(0,240,255,.4); font-family:'Rajdhani',sans-serif; font-weight:700;
    }
    .energy-text {
      font-family:'Orbitron',sans-serif;
      font-size:11px; font-weight:700;
      color:var(--cyan);
    }
    .energy-track {
      width:100%; height:8px; border-radius:8px;
      background:rgba(0,240,255,.07);
      border:1px solid rgba(0,240,255,.12);
      overflow:hidden; position:relative;
    }
    .energy-fill {
      height:100%; border-radius:8px;
      background:linear-gradient(90deg, #0090a8, var(--cyan));
      box-shadow:0 0 10px rgba(0,240,255,.5);
      transition:width .4s ease;
      position:relative;
    }
    .energy-fill::after {
      content:'';
      position:absolute; top:0; right:0; bottom:0; width:30px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.35));
      border-radius:8px;
    }
    .energy-regen {
      font-size:9px; letter-spacing:1.5px;
      color:rgba(0,240,255,.28); margin-top:5px; text-align:right;
    }

    /* ══════════════════════════════════
       INFO CARDS ROW
    ══════════════════════════════════ */
    .cards-row {
      display:grid; grid-template-columns:1fr 1fr;
      gap:10px; width:100%; max-width:340px;
      margin-bottom:16px;
    }
    .info-card {
      background:var(--card-bg);
      border-radius:18px; padding:16px 14px;
      border:1px solid rgba(0,240,255,.1);
      backdrop-filter:blur(14px);
      box-shadow:0 0 24px rgba(0,240,255,.04), inset 0 1px 0 rgba(255,255,255,.04);
      text-align:center;
    }
    .info-card.gold-card { border-color:rgba(255,215,0,.14); box-shadow:0 0 24px rgba(255,215,0,.04), inset 0 1px 0 rgba(255,255,255,.04); }
    .card-icon { font-size:22px; margin-bottom:6px; }
    .card-title { font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:rgba(255,255,255,.28); margin-bottom:4px; }
    .card-val {
      font-family:'Orbitron',sans-serif;
      font-size:20px; font-weight:900;
    }
    .card-val.gold-val  { color:var(--gold);  text-shadow:0 0 10px rgba(255,215,0,.45); }
    .card-val.cyan-val  { color:var(--cyan);  text-shadow:0 0 10px rgba(0,240,255,.45); }
    .card-sub { font-size:9px; letter-spacing:1.5px; color:rgba(255,255,255,.22); margin-top:2px; }

    /* ══════════════════════════════════
       TAP EFFECT ELEMENTS
    ══════════════════════════════════ */
    .floatCoin {
      position:fixed; width:28px; height:28px;
      border-radius:50%; object-fit:cover; pointer-events:none;
      box-shadow:0 0 8px gold, 0 0 18px rgba(255,165,0,.6);
      animation:floatCoinUp 1.1s cubic-bezier(.25,.46,.45,.94) forwards;
    }
    @keyframes floatCoinUp {
      0%   { transform:translateY(0) scale(1) rotate(0deg); opacity:1; }
      60%  { opacity:1; }
      100% { transform:translateY(-110px) scale(.3) rotate(360deg); opacity:0; }
    }
    .plusEffect {
      position:fixed; font-weight:900; font-size:24px; pointer-events:none;
      text-shadow:0 0 10px var(--gold), 0 0 22px rgba(255,215,0,.5);
      color:#ffe566; font-family:'Orbitron',sans-serif;
      animation:plusFly 1s ease-out forwards; white-space:nowrap;
    }
    @keyframes plusFly {
      0%   { transform:translateY(0) scale(1);       opacity:1; }
      30%  { transform:translateY(-24px) scale(1.25); opacity:1; }
      100% { transform:translateY(-90px) scale(.8);   opacity:0; }
    }
    .spark {
      position:fixed; width:5px; height:5px; border-radius:50%; pointer-events:none;
      animation:sparkFly var(--dur) ease-out forwards;
    }
    @keyframes sparkFly {
      0%   { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(var(--tx),var(--ty)) scale(0); opacity:0; }
    }
    .tapRipple {
      position:fixed; width:22px; height:22px; border-radius:50%;
      border:2px solid rgba(0,240,255,.8); pointer-events:none;
      transform:translate(-50%,-50%); animation:rippleOut .6s ease-out forwards;
    }
    @keyframes rippleOut {
      0%   { transform:translate(-50%,-50%) scale(1); opacity:.9; }
      100% { transform:translate(-50%,-50%) scale(5); opacity:0; }
    }
    .noEnergyEffect {
      position:fixed; pointer-events:none;
      font-family:'Orbitron',sans-serif;
      font-size:13px; font-weight:700; letter-spacing:2px;
      color:#ff4d4d; text-shadow:0 0 12px rgba(255,77,77,.7);
      animation:noEnergyFly .8s ease-out forwards; white-space:nowrap;
      transform:translateX(-50%);
    }
    @keyframes noEnergyFly {
      0%  { transform:translateX(-50%) translateY(0); opacity:1; }
      100%{ transform:translateX(-50%) translateY(-50px); opacity:0; }
    }

    /* shared keyframes */
    @keyframes spinCW  { to { transform:rotate( 360deg); } }
    @keyframes spinCCW { to { transform:rotate(-360deg); } }

    /* ══════════════════════════════════
       BOTTOM NAVIGATION
    ══════════════════════════════════ */
    nav {
      position:fixed; bottom:0; left:0; right:0;
      height:var(--nav-h);
      background:rgba(2,7,20,0.92);
      backdrop-filter:blur(24px);
      border-top:1px solid rgba(0,240,255,.1);
      display:flex; align-items:stretch;
      z-index:100;
    }
    nav::before {
      content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
      background:linear-gradient(90deg, transparent, var(--cyan) 30%, var(--gold) 70%, transparent);
      opacity:.3;
    }
    .nav-item {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:4px;
      cursor:pointer; text-decoration:none; color:inherit;
      position:relative; transition:all .2s;
      border:none; background:none; padding:0;
      -webkit-tap-highlight-color:transparent;
    }
    .nav-item.active .nav-icon { color:var(--cyan); filter:drop-shadow(0 0 6px var(--cyan)); }
    .nav-item.active .nav-label { color:var(--cyan); }
    .nav-item.active::before {
      content:''; position:absolute; top:0; left:20%; right:20%; height:2px;
      border-radius:0 0 3px 3px;
      background:linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow:0 0 8px var(--cyan);
    }
    .nav-item:not(.active):hover .nav-icon { color:rgba(255,255,255,.6); }
    .nav-item:not(.active):hover .nav-label { color:rgba(255,255,255,.55); }
    .nav-icon {
      font-size:22px; line-height:1;
      color:rgba(255,255,255,.25);
      transition:color .2s, filter .2s;
    }
    .nav-label {
      font-family:'Orbitron',sans-serif;
      font-size:8px; letter-spacing:2px; text-transform:uppercase;
      color:rgba(255,255,255,.22);
      transition:color .2s;
    }
    /* Earn badge */
    .nav-badge {
      position:absolute; top:8px; right:calc(50% - 14px);
      width:8px; height:8px; border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 8px var(--gold);
      animation:dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100%{box-shadow:0 0 6px var(--gold);} 50%{box-shadow:0 0 14px var(--gold);} }

    /* ══════════════════════════════════
       MOBILE TWEAKS
    ══════════════════════════════════ */
    @media (max-width:380px) {
      .coin-zone  { width:200px; height:200px; }
      .stat-val   { font-size:14px; }
      .stat-pill  { padding:8px 10px; gap:7px; }
      .hdr-title  { font-size:15px; letter-spacing:4px; }
    }
    @media (max-height:700px) {
      .coin-zone  { width:200px; height:200px; margin-bottom:12px; }
      .tap-hint   { margin-bottom:12px; }
      .energy-section { margin-bottom:14px; }
    }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg-space"></div>
<div class="bg-hex"></div>
<div class="bg-scan"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="particles">
  <div class="p"></div><div class="p"></div><div class="p"></div>
  <div class="p"></div><div class="p"></div><div class="p"></div>
  <div class="p"></div><div class="p"></div>
</div>

<!-- Loader -->
<div id="loader">
  <div class="loader-ring">
    <img src="logoveltix.png" class="loader-logo" alt="VELTIX">
  </div>
  <div class="loader-text">Loading dashboard…</div>
</div>

<!-- App shell -->
<div id="app">

  <!-- ── Header ── -->
  <header>
    <div class="hdr-logo">
      <div class="hdr-coin">
        <div class="r1"></div>
        <div class="r2"></div>
        <img src="logoveltix.png" alt="VELTIX">
      </div>
      <span class="hdr-title">VELTIX</span>
    </div>

    <div class="hdr-user">
      <div class="hdr-nick">
        <div class="hdr-nick-name" id="nickDisplay">—</div>
        <div class="level-badge" id="levelBadge">LV 1</div>
      </div>
      <div class="avatar" id="avatarEl" title="Profile">?</div>
    </div>
  </header>

  <!-- ── Stats bar ── -->
  <div class="stats-bar">
    <!-- Coins -->
    <div class="stat-pill gold-pill">
      <div class="stat-icon">🪙</div>
      <div class="stat-info">
        <div class="stat-val gold-val" id="coinStat">0</div>
        <div class="stat-lbl">Coins</div>
      </div>
    </div>
    <!-- Energy -->
    <div class="stat-pill">
      <div class="stat-icon">⚡</div>
      <div class="stat-info">
        <div class="stat-val cyan-val" id="energyStat">500</div>
        <div class="stat-lbl">Energy</div>
      </div>
    </div>
    <!-- Level -->
    <div class="stat-pill green-pill">
      <div class="stat-icon">🏆</div>
      <div class="stat-info">
        <div class="stat-val green-val" id="levelStat">1</div>
        <div class="stat-lbl">Level</div>
      </div>
    </div>
  </div>

  <!-- ── Scroll area ── -->
  <div class="content" id="homeView">

    <!-- Coin tap zone -->
    <div class="coin-section">
      <div class="coin-zone" id="coinZone"
           onclick="handleTap(event)" ontouchstart="handleTap(event)">
        <div class="coin-aura"></div>
        <div class="ring-outer"></div>
        <div class="ring-mid"></div>
        <div class="ring-inner"></div>
        <img src="logoveltix.png" class="coin-img" alt="VELTIX" draggable="false">
        <div class="coin-pulse" id="coinPulse"></div>
      </div>
      <div class="tap-hint">&#9670; TAP TO EARN &#9670;</div>
    </div>

    <!-- Energy bar -->
    <div class="energy-section">
      <div class="energy-header">
        <span class="energy-label">⚡ Energy</span>
        <span class="energy-text"><span id="energyVal">500</span> / <span id="energyMax">500</span></span>
      </div>
      <div class="energy-track">
        <div class="energy-fill" id="energyBar" style="width:100%"></div>
      </div>
      <div class="energy-regen" id="regenText">+1 every 3s</div>
    </div>

    <!-- Info cards -->
    <div class="cards-row">
      <div class="info-card gold-card">
        <div class="card-icon">🪙</div>
        <div class="card-title">Total Coins</div>
        <div class="card-val gold-val" id="coinCard">0</div>
        <div class="card-sub">Earned today</div>
      </div>
      <div class="info-card">
        <div class="card-icon">🏅</div>
        <div class="card-title">Tap Power</div>
        <div class="card-val cyan-val" id="tapPowerCard">+1</div>
        <div class="card-sub">Per tap</div>
      </div>
    </div>

  </div><!-- .content -->

  <!-- ── Bottom Navigation ── -->
  <nav>
    <button class="nav-item active" id="nav-home" onclick="navTo('home', this)">
      <span class="nav-icon">⌂</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" id="nav-earn" onclick="navTo('earn', this)">
      <div class="nav-badge"></div>
      <span class="nav-icon">💎</span>
      <span class="nav-label">Earn</span>
    </button>
    <button class="nav-item" id="nav-shop" onclick="navTo('shop', this)">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">Shop</span>
    </button>
    <button class="nav-item" id="nav-profile" onclick="navTo('profile', this)">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </button>
  </nav>

</div><!-- #app -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ─── Firebase init ───────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:    "AIzaSyCU5JdLURDc23XCZPZU49EIc_BdNgllsno",
  authDomain:"veltix-game.firebaseapp.com",
  projectId: "veltix-game"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ─── Game state ──────────────────────────────────────────────────────────────
const MAX_ENERGY = 500;
const REGEN_INTERVAL_MS = 3000;   // regen 1 energy every 3 s
const SAVE_DEBOUNCE_MS  = 1500;   // batch Firestore writes

let state = { coin: 0, level: 1, energy: MAX_ENERGY };
let userRef   = null;
let saveTimer = null;

// ─── Auth guard ──────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (!user || !user.emailVerified) {
    window.location.href = "/login.html";
    return;
  }

  // Resolve display name: displayName > Firestore nickname > email prefix
  const nick = user.displayName || user.email.split("@")[0];
  const initial = nick.charAt(0).toUpperCase();

  document.getElementById("nickDisplay").textContent = nick;
  document.getElementById("avatarEl").textContent    = initial;

  userRef = doc(db, "players", user.uid);
  await loadProgress();

  renderAll();
  startEnergyRegen();

  // Fade in
  document.getElementById("loader").classList.add("hidden");
  document.getElementById("app").classList.add("visible");
});

// ─── Load / Save ─────────────────────────────────────────────────────────────
async function loadProgress() {
  try {
    const snap = await getDoc(userRef);
    if (snap.exists()) {
      const d     = snap.data();
      state.coin   = d.coin   ?? 0;
      state.level  = d.level  ?? 1;
      state.energy = d.energy ?? MAX_ENERGY;
      // Cap energy in case we tweaked MAX
      if (state.energy > MAX_ENERGY) state.energy = MAX_ENERGY;
    }
  } catch (e) {
    console.warn("Could not load progress:", e.message);
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!userRef) return;
    setDoc(userRef, {
      coin:   state.coin,
      level:  state.level,
      energy: state.energy
    }, { merge: true }).catch(e => console.warn("Save failed:", e.message));
  }, SAVE_DEBOUNCE_MS);
}

// ─── UI helpers ──────────────────────────────────────────────────────────────
function renderAll() {
  const tapPower = Math.floor((state.level - 1) / 10) + 1;

  // Stats bar
  document.getElementById("coinStat").textContent   = formatNum(state.coin);
  document.getElementById("energyStat").textContent = state.energy;
  document.getElementById("levelStat").textContent  = state.level;

  // Header level badge
  document.getElementById("levelBadge").textContent = "LV " + state.level;

  // Energy bar
  document.getElementById("energyVal").textContent = state.energy;
  document.getElementById("energyMax").textContent = MAX_ENERGY;
  document.getElementById("energyBar").style.width =
    (state.energy / MAX_ENERGY * 100).toFixed(1) + "%";

  // Cards
  document.getElementById("coinCard").textContent     = formatNum(state.coin);
  document.getElementById("tapPowerCard").textContent = "+" + tapPower;
}

function formatNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
  if (n >= 1_000)     return (n / 1_000).toFixed(1) + "K";
  return n.toString();
}

function popEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("pop");
  void el.offsetWidth;
  el.classList.add("pop");
  setTimeout(() => el.classList.remove("pop"), 300);
}

// ─── Energy regen ────────────────────────────────────────────────────────────
function startEnergyRegen() {
  setInterval(() => {
    if (state.energy < MAX_ENERGY) {
      state.energy = Math.min(state.energy + 1, MAX_ENERGY);
      document.getElementById("energyVal").textContent  = state.energy;
      document.getElementById("energyStat").textContent = state.energy;
      document.getElementById("energyBar").style.width  =
        (state.energy / MAX_ENERGY * 100).toFixed(1) + "%";
    }
  }, REGEN_INTERVAL_MS);
}

// ─── Visual effects ──────────────────────────────────────────────────────────
const SPARK_COLORS = ["#00f0ff","#ffd700","#ffffff","#ff9900","#00ff88"];

function spawnSparks(x, y, count = 10) {
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "spark";
    const angle = (360 / count) * i + Math.random() * 18;
    const dist  = 45 + Math.random() * 65;
    const rad   = angle * Math.PI / 180;
    el.style.setProperty("--tx",  (Math.cos(rad) * dist) + "px");
    el.style.setProperty("--ty",  (Math.sin(rad) * dist) + "px");
    el.style.setProperty("--dur", (.35 + Math.random() * .5) + "s");
    el.style.left       = x + "px";
    el.style.top        = y + "px";
    el.style.background = SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)];
    el.style.boxShadow  = `0 0 6px ${el.style.background}`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
}

function spawnRipple(x, y) {
  const el = document.createElement("div");
  el.className = "tapRipple";
  el.style.left = x + "px";
  el.style.top  = y + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 620);
}

function spawnFloatingCoin(x, y) {
  const img = document.createElement("img");
  img.src       = "logoveltix.png";
  img.className = "floatCoin";
  img.style.left = (x - 14) + "px";
  img.style.top  = (y - 14) + "px";
  document.body.appendChild(img);
  setTimeout(() => img.remove(), 1100);
}

function spawnPlusLabel(x, y, amount) {
  const el = document.createElement("div");
  el.className   = "plusEffect";
  el.textContent = "+" + amount;
  el.style.left  = (x + 16) + "px";
  el.style.top   = (y - 10) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function bounceCoin() {
  const zone = document.getElementById("coinZone");
  zone.classList.remove("tapped");
  void zone.offsetWidth;
  zone.classList.add("tapped");
  setTimeout(() => zone.classList.remove("tapped"), 400);
}

function shakeNoEnergy(x, y) {
  const zone = document.getElementById("coinZone");
  zone.classList.add("no-energy");
  setTimeout(() => zone.classList.remove("no-energy"), 360);

  const el = document.createElement("div");
  el.className   = "noEnergyEffect";
  el.textContent = "NO ENERGY";
  el.style.left  = x + "px";
  el.style.top   = (y - 10) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

// ─── Tap handler ─────────────────────────────────────────────────────────────
let lastTap = 0;

window.handleTap = function(event) {
  event.preventDefault();
  const now = Date.now();
  if (now - lastTap < 80) return; // debounce touch+click double-fire
  lastTap = now;

  // Coordinates
  let x, y;
  if (event.touches && event.touches.length) {
    x = event.touches[0].clientX;
    y = event.touches[0].clientY;
  } else {
    x = event.clientX;
    y = event.clientY;
  }

  if (state.energy <= 0) {
    shakeNoEnergy(x, y);
    return;
  }

  const tapPower = Math.floor((state.level - 1) / 10) + 1;

  state.coin++;
  state.energy = Math.max(0, state.energy - 1);

  // Persist
  scheduleSave();

  // Update UI numbers
  renderAll();

  // Animations
  bounceCoin();
  popEl("coinStat");
  popEl("coinCard");
  spawnRipple(x, y);
  spawnSparks(x, y, 10);
  spawnFloatingCoin(x, y);
  spawnPlusLabel(x, y, tapPower);
};

// ─── Nav routing ─────────────────────────────────────────────────────────────
window.navTo = function(page, el) {
  // Update active state
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  el.classList.add("active");

  // Placeholder routing — future pages link here
  const routes = {
    home:    null,        // stays on dashboard
    earn:    "earn.html",
    shop:    "shop.html",
    profile: "profile.html"
  };

  if (page !== "home" && routes[page]) {
    // Navigate when page exists; silently do nothing until pages are built
    // window.location.href = "/" + routes[page];
    // For now: flash a "coming soon" hint on the coin hint text
    const hint = document.querySelector(".tap-hint");
    const orig = hint.textContent;
    hint.style.color = "rgba(255,215,0,.7)";
    hint.textContent = "◆ COMING SOON ◆";
    setTimeout(() => {
      hint.style.color = "";
      hint.textContent = orig;
      // reset active to home
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      document.getElementById("nav-home").classList.add("active");
    }, 1800);
  }
};

// ─── Logout (exposed for future profile button) ───────────────────────────────
window.doLogout = function() {
  scheduleSave();
  setTimeout(() => {
    signOut(auth).then(() => { window.location.href = "/login.html"; });
  }, SAVE_DEBOUNCE_MS);
};
</script>

</body>
</html>
