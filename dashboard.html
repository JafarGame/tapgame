<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VELTIX — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Your VELTIX game dashboard. Tap the coin, earn rewards, and level up.">
  <meta name="theme-color" content="#00f0ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RESET & TOKENS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:     #00f0ff;
      --cyan-dim: rgba(0,240,255,.12);
      --gold:     #ffd700;
      --gold-dim: rgba(255,215,0,.12);
      --green:    #00e676;
      --red:      #ff4d4d;
      --dark:     #03080f;
      --surface:  rgba(6,14,34,.82);
      --border:   rgba(0,240,255,.1);
      --nav-h:    72px;
      --hdr-h:    80px;
      --safe-b:   env(safe-area-inset-bottom, 0px);
    }

    html { height: 100%; }
    body {
      height: 100%; width: 100%;
      background: var(--dark);
      color: #fff;
      font-family: 'Rajdhani', system-ui, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BACKGROUND SYSTEM
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .bg-space {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 130% 70% at 50% -10%, #071a45 0%, transparent 58%),
        radial-gradient(ellipse 70% 55% at 100% 110%, #1b0438 0%, transparent 52%),
        radial-gradient(ellipse 60% 50% at -5% 90%,  #011d36 0%, transparent 48%),
        #03080f;
    }
    .bg-hex {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: radial-gradient(circle, rgba(0,240,255,.1) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 10%, transparent 100%);
      animation: hexMove 22s linear infinite;
    }
    @keyframes hexMove { to { background-position: 34px 34px; } }

    .bg-lines {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,240,255,.008) 2px, rgba(0,240,255,.008) 3px
      );
    }

    .orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
      filter: blur(120px); animation: orbDrift 16s ease-in-out infinite alternate;
    }
    .orb-a { width:500px; height:500px; background:#0080cc; opacity:.07; top:-200px; left:-180px; }
    .orb-b { width:380px; height:380px; background:#cc8800; opacity:.06; bottom:-150px; right:-150px; animation-delay:-7s; }
    .orb-c { width:220px; height:220px; background:#5500cc; opacity:.08; top:40%; left:62%; animation-delay:-12s; }
    @keyframes orbDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,24px) scale(1.12); }
    }

    /* ambient particles */
    .pts { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
    .pt  { position:absolute; border-radius:50%; opacity:0; animation:ptRise linear infinite; }
    .pt:nth-child(1)  { left: 6%; width:3px;height:3px; background:var(--gold); animation-duration:11s; animation-delay:0s; }
    .pt:nth-child(2)  { left:16%; width:2px;height:2px; background:var(--cyan); animation-duration:14s; animation-delay:2s; }
    .pt:nth-child(3)  { left:28%; width:2px;height:2px; background:var(--gold); animation-duration: 9s; animation-delay:5s; }
    .pt:nth-child(4)  { left:40%; width:2px;height:2px; background:var(--cyan); animation-duration:12s; animation-delay:1s; }
    .pt:nth-child(5)  { left:53%; width:3px;height:3px; background:var(--gold); animation-duration: 8s; animation-delay:3.5s; }
    .pt:nth-child(6)  { left:65%; width:2px;height:2px; background:var(--cyan); animation-duration:15s; animation-delay:0.5s; }
    .pt:nth-child(7)  { left:78%; width:2px;height:2px; background:var(--gold); animation-duration:10s; animation-delay:4s; }
    .pt:nth-child(8)  { left:90%; width:2px;height:2px; background:var(--cyan); animation-duration:12s; animation-delay:7s; }
    @keyframes ptRise {
      0%   { transform:translateY(105vh); opacity:0; }
      8%   { opacity:.75; }
      90%  { opacity:.3; }
      100% { transform:translateY(-5vh) translateX(18px); opacity:0; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       LOADER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: var(--dark);
      transition: opacity .55s ease, visibility .55s ease;
    }
    #loader.out { opacity: 0; visibility: hidden; pointer-events: none; }

    .ld-ring {
      position: relative; width: 84px; height: 84px;
    }
    .ld-ring::before {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--cyan) 0%, var(--gold) 50%, var(--cyan) 100%);
      animation: spin 1.3s linear infinite;
    }
    .ld-ring::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--cyan), var(--gold), var(--cyan));
      filter: blur(8px); opacity: .5; animation: spin 1.3s linear infinite;
    }
    .ld-logo {
      position: relative; z-index: 1;
      width: 76px; height: 76px; border-radius: 50%;
      object-fit: cover; display: block; margin: auto;
      border: 3px solid var(--dark);
    }
    .ld-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(0,240,255,.5);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.3;} 50%{opacity:1;} }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       APP SHELL
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #app {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      opacity: 0; transition: opacity .5s ease;
    }
    #app.show { opacity: 1; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       HEADER — improved profile
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .hdr {
      position: relative; z-index: 50;
      height: var(--hdr-h); flex-shrink: 0;
      display: flex; align-items: center;
      padding: 0 14px; gap: 11px;
      background: rgba(3,8,15,.88);
      backdrop-filter: blur(28px) saturate(1.5);
      border-bottom: 1px solid var(--border);
    }
    .hdr::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 30%, var(--gold) 70%, transparent 100%);
      opacity: .4;
    }

    /* Avatar — larger with online dot */
    .hdr-avatar {
      position: relative; flex-shrink: 0;
      width: 48px; height: 48px;
    }
    .hdr-avatar-ring {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--gold), var(--cyan), #ff9900, var(--gold));
      animation: spin 5s linear infinite;
    }
    .hdr-avatar-glow {
      position: absolute; inset: -6px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--gold), var(--cyan), var(--gold));
      filter: blur(8px); opacity: .35;
      animation: spin 5s linear infinite;
    }
    .hdr-avatar-inner {
      position: absolute; inset: 0; border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,240,255,.22), rgba(255,215,0,.15));
      border: 2px solid rgba(3,8,15,.95);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 19px; font-weight: 900;
      color: var(--cyan);
      text-shadow: 0 0 14px var(--cyan);
      z-index: 1;
    }
    /* Online dot */
    .hdr-online {
      position: absolute; bottom: 1px; right: 1px; z-index: 2;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green);
      border: 2px solid rgba(3,8,15,.95);
      box-shadow: 0 0 8px var(--green), 0 0 14px rgba(0,230,118,.4);
      animation: onlinePulse 2.2s ease-in-out infinite;
    }
    @keyframes onlinePulse { 0%,100%{box-shadow:0 0 6px var(--green);} 50%{box-shadow:0 0 14px var(--green),0 0 24px rgba(0,230,118,.5);} }

    /* User info block */
    .hdr-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .hdr-nick {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: .5px;
      color: #fff; line-height: 1.1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hdr-sub {
      display: flex; align-items: center; gap: 6px;
    }
    .hdr-lvl {
      font-family: 'Orbitron', sans-serif;
      font-size: 8px; font-weight: 700; letter-spacing: 1.5px;
      color: var(--gold);
      background: linear-gradient(135deg, rgba(25,16,0,.95), rgba(50,32,0,.95));
      border: 1px solid rgba(255,215,0,.4);
      border-radius: 6px; padding: 2px 7px;
      box-shadow: 0 0 10px rgba(255,215,0,.2), inset 0 1px 0 rgba(255,215,0,.1);
    }
    .hdr-rank {
      font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(0,240,255,.4);
    }
    /* XP mini bar under name */
    .hdr-xp-track {
      height: 3px; border-radius: 3px;
      background: rgba(0,240,255,.08);
      border: 1px solid rgba(0,240,255,.08);
      overflow: hidden; position: relative;
    }
    .hdr-xp-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      box-shadow: 0 0 8px rgba(0,240,255,.6);
      transition: width .6s cubic-bezier(.34,1.56,.64,1);
      position: relative;
    }
    .hdr-xp-fill::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 20px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5));
      animation: xpShimmer 2s ease-in-out infinite;
    }
    @keyframes xpShimmer { 0%,100%{opacity:.4;} 50%{opacity:1;} }

    /* Coin display in header */
    .hdr-coins {
      display: flex; align-items: center; gap: 5px;
      background: linear-gradient(135deg, rgba(255,215,0,.1), rgba(255,165,0,.06));
      border: 1px solid rgba(255,215,0,.25);
      border-radius: 22px; padding: 6px 11px 6px 7px;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(255,215,0,.1), inset 0 1px 0 rgba(255,215,0,.08);
      position: relative; overflow: hidden;
    }
    .hdr-coins::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.04), transparent);
      pointer-events: none;
    }
    .hdr-coin-icon {
      width: 22px; height: 22px; border-radius: 50%;
      object-fit: cover;
      filter: drop-shadow(0 0 5px rgba(255,215,0,.7));
      animation: coinPillSpin 6s ease-in-out infinite alternate;
    }
    @keyframes coinPillSpin { 0%{filter:drop-shadow(0 0 4px rgba(255,215,0,.5));} 100%{filter:drop-shadow(0 0 9px rgba(255,215,0,.9));} }
    .hdr-coin-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(255,215,0,.6);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SCROLLABLE CONTENT
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
      scrollbar-width: none; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }

    /* inner wrapper */
    .inner {
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 14px 0;
      max-width: 420px; margin: 0 auto;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       STATS ROW
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; width: 100%; margin-bottom: 18px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      backdrop-filter: blur(14px);
      position: relative; overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease;
      will-change: transform;
    }
    .stat-card:active { transform: scale(.96); }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      border-radius: 16px 16px 0 0;
    }
    .stat-card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,.04) 0%, transparent 60%);
      pointer-events: none;
    }
    .stat-card.c-gold::before  { background: linear-gradient(90deg, transparent, var(--gold), transparent); box-shadow: 0 0 12px rgba(255,215,0,.4); }
    .stat-card.c-cyan::before  { background: linear-gradient(90deg, transparent, var(--cyan), transparent); box-shadow: 0 0 12px rgba(0,240,255,.4); }
    .stat-card.c-green::before { background: linear-gradient(90deg, transparent, var(--green), transparent); box-shadow: 0 0 12px rgba(0,230,118,.4); }
    .stat-emoji { font-size: 15px; line-height: 1; }
    .stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px; font-weight: 900; line-height: 1.1;
      will-change: transform;
    }
    .stat-val.pop { animation: numPop .22s ease; }
    @keyframes numPop { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }
    .stat-card.c-gold  .stat-val { color:var(--gold);  text-shadow:0 0 12px rgba(255,215,0,.6); }
    .stat-card.c-cyan  .stat-val { color:var(--cyan);  text-shadow:0 0 12px rgba(0,240,255,.6); }
    .stat-card.c-green .stat-val { color:var(--green); text-shadow:0 0 12px rgba(0,230,118,.6); }
    .stat-lbl {
      font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,.28);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       COIN TAP ZONE — enhanced
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .coin-wrap {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 16px;
    }

    /* Outer tap zone — large invisible touch target */
    .coin-zone {
      position: relative;
      width: 240px; height: 240px;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      will-change: transform;
    }

    /* Outer ambient glow disc */
    .coin-aura {
      position: absolute; inset: -36px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(0,240,255,.18) 0%, rgba(255,215,0,.08) 42%, transparent 68%);
      animation: aura 3.8s ease-in-out infinite;
    }
    @keyframes aura { 0%,100%{transform:scale(1); opacity:.6;} 50%{transform:scale(1.12); opacity:1;} }

    /* Second outer aura — gold ring */
    .coin-aura-gold {
      position: absolute; inset: -20px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, transparent 55%, rgba(255,215,0,.12) 72%, transparent 88%);
      animation: auraGold 5s ease-in-out infinite reverse;
    }
    @keyframes auraGold { 0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.06) rotate(180deg);} }

    /* Ring 1 — gold conic, slow */
    .rg1 {
      position: absolute; inset: -14px; border-radius: 50%;
      background: conic-gradient(from 0deg,
        #3a2000 0%, #ffd700 12%, #fff4b0 28%, #ffd700 42%,
        #6a3d00 52%, #ffd700 66%, #fff4b0 82%, #3a2000 100%);
      animation: spin 9s linear infinite;
      will-change: transform;
    }
    .rg1::after { content:''; position:absolute; inset:7px; border-radius:50%; background:#03080f; }

    /* Ring 2 — cyan dashes, CCW */
    .rg2 {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg,
        transparent  0deg, var(--cyan)  50deg, rgba(0,240,255,.2)  88deg, transparent 108deg,
        transparent 175deg, #00c8ff    228deg, rgba(0,200,255,.2)  264deg, transparent 286deg
      );
      animation: spinR 3.2s linear infinite;
      will-change: transform;
    }
    .rg2::after { content:''; position:absolute; inset:5px; border-radius:50%; background:#03080f; }

    /* Ring 3 — shimmer fast */
    .rg3 {
      position: absolute; inset: 4px; border-radius: 50%;
      background: conic-gradient(from 0deg,
        transparent  0deg, rgba(255,255,255,.28)  26deg, transparent  52deg,
        transparent 175deg, rgba(0,240,255,.2) 201deg, transparent 227deg
      );
      animation: spin 2.1s linear infinite;
      will-change: transform;
    }
    .rg3::after { content:''; position:absolute; inset:5px; border-radius:50%; background:#03080f; }

    /* Orbit dots — 4 small dots orbiting around */
    .orbit-ring {
      position: absolute; inset: -22px; border-radius: 50%; pointer-events: none;
      animation: spinR 6s linear infinite;
      will-change: transform;
    }
    .orbit-dot {
      position: absolute; border-radius: 50%;
      width: 6px; height: 6px;
      box-shadow: 0 0 8px currentColor;
    }
    .orbit-dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%) translateY(-3px); background: var(--gold); color: var(--gold); }
    .orbit-dot:nth-child(2) { bottom: 0; left: 50%; transform: translateX(-50%) translateY(3px); background: var(--cyan); color: var(--cyan); }
    .orbit-dot:nth-child(3) { left: 0; top: 50%; transform: translateY(-50%) translateX(-3px); background: rgba(255,255,255,.7); color: rgba(255,255,255,.7); }
    .orbit-dot:nth-child(4) { right: 0; top: 50%; transform: translateY(-50%) translateX(3px); background: var(--gold); color: var(--gold); }

    /* Second orbit ring — smaller dots */
    .orbit-ring-2 {
      position: absolute; inset: 8px; border-radius: 50%; pointer-events: none;
      animation: spin 4.5s linear infinite;
      will-change: transform;
    }
    .orbit-dot-2 {
      position: absolute; border-radius: 50%;
      width: 4px; height: 4px;
    }
    .orbit-dot-2:nth-child(1) { top: -2px; left: 50%; transform: translateX(-50%); background: rgba(0,240,255,.6); box-shadow: 0 0 5px var(--cyan); }
    .orbit-dot-2:nth-child(2) { bottom: -2px; right: 30%; background: rgba(255,215,0,.5); box-shadow: 0 0 5px var(--gold); }
    .orbit-dot-2:nth-child(3) { top: 30%; right: -2px; background: rgba(255,255,255,.4); box-shadow: 0 0 4px #fff; }

    /* Coin image */
    .coin-img {
      position: absolute; inset: 14px;
      width: calc(100% - 28px); height: calc(100% - 28px);
      border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(255,215,0,.35);
      box-shadow:
        0 0 28px rgba(0,240,255,.38),
        0 0 56px rgba(255,215,0,.16),
        0 0 4px rgba(255,215,0,.5),
        inset 0 0 22px rgba(0,0,0,.5);
      animation: coinFloat 3.8s ease-in-out infinite, coinShine 8s ease-in-out infinite;
      will-change: transform, filter;
    }
    @keyframes coinFloat {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-10px) scale(1.015); }
    }
    @keyframes coinShine {
      0%,100% { filter: brightness(1)    drop-shadow(0 0 16px rgba(0,240,255,.5)); }
      30%     { filter: brightness(1.25) drop-shadow(8px 0 24px rgba(0,240,255,.85)); }
      70%     { filter: brightness(1.25) drop-shadow(-8px 0 24px rgba(255,215,0,.7)); }
    }

    /* Inner glow core */
    .coin-core {
      position: absolute; inset: 30px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(0,240,255,.08) 0%, transparent 70%);
      animation: coreGlow 3s ease-in-out infinite alternate;
    }
    @keyframes coreGlow { from{opacity:.5;transform:scale(.9);} to{opacity:1;transform:scale(1.08);} }

    /* Tap bounce — more dramatic with 3D feel */
    .coin-zone.tapped .coin-img  {
      animation: coinBounce .36s cubic-bezier(.36,.07,.19,.97) both;
    }
    .coin-zone.tapped .coin-aura { animation: auraFlash .36s ease-out both; }
    .coin-zone.tapped .orbit-ring { animation: spinR 6s linear infinite, orbitBlast .36s ease-out; }
    @keyframes coinBounce {
      0%  { transform:scale(1) rotate(0deg); filter: brightness(1); }
      18% { transform:scale(.80) rotate(-6deg); filter: brightness(1.8) drop-shadow(0 0 30px var(--cyan)); }
      52% { transform:scale(1.18) rotate(4deg); filter: brightness(1.5) drop-shadow(0 0 20px var(--gold)); }
      78% { transform:scale(.96) rotate(-1deg); filter: brightness(1.1); }
      100%{ transform:scale(1) rotate(0deg); filter: brightness(1); }
    }
    @keyframes auraFlash {
      0%  { transform:scale(1);    opacity:.6; }
      35% { transform:scale(1.35); opacity:1; filter:brightness(2.5); }
      100%{ transform:scale(1.08); opacity:.6; }
    }
    @keyframes orbitBlast {
      0%  { transform:scale(1); }
      40% { transform:scale(1.15); }
      100%{ transform:scale(1); }
    }

    /* Multiple pulse rings on tap */
    .coin-pulse {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(0,240,255,.8);
      opacity: 0; pointer-events: none;
    }
    .coin-pulse-2 {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 1.5px solid rgba(255,215,0,.6);
      opacity: 0; pointer-events: none;
    }
    .coin-pulse-3 {
      position: absolute; inset: -18px; border-radius: 50%;
      border: 1px solid rgba(0,240,255,.4);
      opacity: 0; pointer-events: none;
    }
    .coin-zone.tapped .coin-pulse  { animation: pulseOut  .55s ease-out forwards; }
    .coin-zone.tapped .coin-pulse-2 { animation: pulseOut2 .7s  ease-out .08s forwards; }
    .coin-zone.tapped .coin-pulse-3 { animation: pulseOut3 .85s ease-out .16s forwards; }
    @keyframes pulseOut  { 0%{transform:scale(1);   opacity:.9;} 100%{transform:scale(1.7); opacity:0;} }
    @keyframes pulseOut2 { 0%{transform:scale(1);   opacity:.7;} 100%{transform:scale(1.6); opacity:0;} }
    @keyframes pulseOut3 { 0%{transform:scale(1);   opacity:.5;} 100%{transform:scale(1.5); opacity:0;} }

    /* No-energy shake */
    .coin-zone.empty { animation: shake .32s ease; }
    @keyframes shake {
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-8px);}
      40%{transform:translateX(8px);}
      60%{transform:translateX(-5px);}
      80%{transform:translateX(5px);}
    }

    /* TAP hint */
    .tap-hint {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(0,240,255,.35);
      margin-top: 6px; margin-bottom: 12px;
      animation: hintBlink 2.4s ease-in-out infinite;
    }
    @keyframes hintBlink { 0%,100%{opacity:.3;} 50%{opacity:.8;} }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       ENERGY SECTION — enhanced
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .energy-box {
      width: 100%; margin-bottom: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 14px 16px;
      backdrop-filter: blur(14px);
      position: relative; overflow: hidden;
      transition: border-color .4s ease, box-shadow .4s ease;
    }
    .energy-box::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,240,255,.03) 0%, transparent 60%);
      pointer-events: none;
    }
    /* Low energy warning state */
    .energy-box.low {
      border-color: rgba(255,77,77,.35);
      box-shadow: 0 0 20px rgba(255,77,77,.1), inset 0 0 30px rgba(255,77,77,.04);
    }

    .energy-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .energy-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(0,240,255,.55); font-weight: 700;
    }
    .energy-label svg {
      width: 14px; height: 14px; fill: var(--cyan);
      filter: drop-shadow(0 0 5px var(--cyan));
      transition: fill .4s, filter .4s;
    }
    .energy-box.low .energy-label { color: rgba(255,77,77,.7); }
    .energy-box.low .energy-label svg { fill: var(--red); filter: drop-shadow(0 0 6px var(--red)); animation: blink .9s ease-in-out infinite; }

    .energy-nums {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 900; color: var(--cyan);
      text-shadow: 0 0 10px rgba(0,240,255,.55);
      transition: color .4s, text-shadow .4s;
    }
    .energy-box.low .energy-nums { color: var(--red); text-shadow: 0 0 10px rgba(255,77,77,.6); }

    /* Track + segmented fill */
    .energy-track {
      position: relative; height: 12px; border-radius: 12px;
      background: rgba(0,240,255,.05);
      border: 1px solid rgba(0,240,255,.12);
      overflow: hidden;
    }
    .energy-fill {
      height: 100%; border-radius: 12px;
      background: linear-gradient(90deg, #005c6e, #009eb5, #00e4f5, var(--cyan));
      box-shadow: 0 0 14px rgba(0,240,255,.6), 0 0 30px rgba(0,240,255,.25);
      transition: width .4s cubic-bezier(.34,1.56,.64,1);
      position: relative; overflow: hidden;
    }
    .energy-box.low .energy-fill {
      background: linear-gradient(90deg, #5c0000, #bb2020, var(--red));
      box-shadow: 0 0 14px rgba(255,77,77,.6), 0 0 28px rgba(255,77,77,.2);
    }
    /* animated shine wave on fill */
    .energy-fill::before {
      content: ''; position: absolute;
      top: 0; left: -60px; bottom: 0; width: 60px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
      animation: energyWave 2.2s ease-in-out infinite;
    }
    @keyframes energyWave {
      0%   { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 60px)); }
    }
    .energy-fill::after {
      content: ''; position: absolute;
      top: 0; right: 0; bottom: 0; width: 50px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35));
      border-radius: 12px;
    }
    /* Segment tick marks */
    .energy-segments {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; justify-content: space-between; align-items: stretch;
      padding: 0 10%;
    }
    .energy-seg {
      width: 1px; background: rgba(0,0,0,.25);
    }

    .energy-meta {
      display: flex; justify-content: space-between;
      margin-top: 7px;
    }
    .energy-regen {
      font-size: 9px; letter-spacing: 1.5px;
      color: rgba(0,240,255,.3);
      transition: color .4s;
    }
    .energy-box.low .energy-regen { color: rgba(255,77,77,.45); }
    .energy-pct {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; color: rgba(0,240,255,.38);
      transition: color .4s;
    }
    .energy-box.low .energy-pct { color: rgba(255,77,77,.55); }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       INFO CARDS GRID
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .grid2 {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; width: 100%; margin-bottom: 20px;
    }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 18px 14px;
      backdrop-filter: blur(14px);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      position: relative; overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
      will-change: transform;
    }
    .info-card:active { transform: scale(.97); }
    .info-card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,240,255,.04) 0%, transparent 55%);
      pointer-events: none;
    }
    .info-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,.18), transparent);
    }
    .ic-icon { font-size: 26px; }
    .ic-lbl  { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.25); }
    .ic-val  {
      font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900;
    }
    .ic-val.gold  { color:var(--gold);  text-shadow:0 0 14px rgba(255,215,0,.5); }
    .ic-val.cyan  { color:var(--cyan);  text-shadow:0 0 14px rgba(0,240,255,.5); }
    .ic-sub  { font-size: 9px; color: rgba(255,255,255,.2); }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       TAP EFFECTS (DOM-spawned)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    /* +N floating label */
    .fx-plus {
      position: fixed; pointer-events: none; z-index: 9000;
      display: flex; align-items: center; gap: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 24px; font-weight: 900;
      color: #ffe566;
      text-shadow: 0 0 14px var(--gold), 0 0 28px rgba(255,215,0,.5);
      animation: fxPlus 1s cubic-bezier(.22,1,.36,1) forwards;
      white-space: nowrap;
      will-change: transform, opacity;
    }
    .fx-plus-img {
      width: 22px; height: 22px; border-radius: 50%; object-fit: cover;
      filter: drop-shadow(0 0 6px var(--gold));
    }
    @keyframes fxPlus {
      0%  { transform: translateY(0) scale(.85);     opacity: 1; }
      20% { transform: translateY(-28px) scale(1.25); opacity: 1; }
      100%{ transform: translateY(-95px) scale(.65);  opacity: 0; }
    }

    /* spark particle */
    .fx-spark {
      position: fixed; pointer-events: none; z-index: 9000;
      animation: fxSpark var(--d) ease-out forwards;
      will-change: transform, opacity;
    }
    .fx-spark.round { border-radius: 50%; }
    .fx-spark.star  {
      clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    }
    @keyframes fxSpark {
      0%  { transform:translate(0,0) scale(1.4) rotate(0deg);   opacity:1; }
      100%{ transform:translate(var(--x),var(--y)) scale(0) rotate(var(--r)); opacity:0; }
    }

    /* ripple at tap point */
    .fx-ripple {
      position: fixed; pointer-events: none; z-index: 9000;
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid rgba(0,240,255,.9);
      transform: translate(-50%,-50%);
      animation: fxRipple .6s ease-out forwards;
      will-change: transform, opacity;
    }
    .fx-ripple-gold {
      position: fixed; pointer-events: none; z-index: 9000;
      width: 20px; height: 20px; border-radius: 50%;
      border: 1.5px solid rgba(255,215,0,.7);
      transform: translate(-50%,-50%);
      animation: fxRipple .75s ease-out .08s forwards;
      will-change: transform, opacity;
    }
    @keyframes fxRipple {
      0%  { transform:translate(-50%,-50%) scale(1);   opacity:.95; }
      100%{ transform:translate(-50%,-50%) scale(6.5); opacity:0; }
    }

    /* flying coin image */
    .fx-coin {
      position: fixed; pointer-events: none; z-index: 9000;
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 10px var(--gold), 0 0 22px rgba(255,165,0,.6);
      animation: fxCoin 1.1s cubic-bezier(.25,.46,.45,.94) forwards;
      will-change: transform, opacity;
    }
    @keyframes fxCoin {
      0%  { transform:translateY(0) scale(1) rotate(0deg);    opacity:1; }
      55% { opacity:1; }
      100%{ transform:translateY(-115px) scale(.2) rotate(420deg); opacity:0; }
    }

    /* no energy warning */
    .fx-nrg {
      position: fixed; pointer-events: none; z-index: 9000;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 2px;
      color: var(--red); text-shadow: 0 0 12px rgba(255,77,77,.8);
      transform: translateX(-50%);
      animation: fxNrg .8s ease-out forwards;
    }
    @keyframes fxNrg {
      0%  { transform:translateX(-50%) translateY(0) scale(1.1); opacity:1; }
      100%{ transform:translateX(-50%) translateY(-50px) scale(.9); opacity:0; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BOTTOM NAVIGATION
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(3,8,15,.94);
      backdrop-filter: blur(32px) saturate(1.6);
      border-top: 1px solid var(--border);
      display: flex; align-items: stretch;
    }
    .nav::before {
      content: ''; position: absolute; top: 0; left: 6%; right: 6%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan) 32%, var(--gold) 68%, transparent);
      opacity: .35;
    }

    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      border: none; background: none; cursor: pointer; padding: 0;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      transition: transform .1s ease;
    }
    .nav-btn:active { transform: scale(.92); }

    .nav-btn.active::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 2px;
      border-radius: 0 0 5px 5px;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(0,240,255,.55);
    }
    .nav-btn.active .nav-icon-wrap {
      filter: drop-shadow(0 0 10px var(--cyan));
    }

    .nav-icon-wrap {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      transition: filter .2s, transform .1s;
    }
    .nav-icon-wrap svg {
      width: 100%; height: 100%;
      fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
      transition: stroke .2s;
    }
    .nav-btn.active .nav-icon-wrap svg { stroke: var(--cyan); }
    .nav-btn:not(.active) .nav-icon-wrap svg { stroke: rgba(255,255,255,.28); }
    .nav-btn:not(.active):active .nav-icon-wrap svg { stroke: rgba(255,255,255,.55); }

    .nav-lbl {
      font-family: 'Orbitron', sans-serif;
      font-size: 7.5px; letter-spacing: 1.5px; text-transform: uppercase;
      transition: color .2s;
    }
    .nav-btn.active .nav-lbl { color: var(--cyan); }
    .nav-btn:not(.active) .nav-lbl { color: rgba(255,255,255,.22); }

    .nav-dot {
      position: absolute; top: 8px; right: calc(50% - 16px);
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold), 0 0 18px rgba(255,215,0,.5);
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100%{opacity:.8;} 50%{opacity:1; transform:scale(1.3);} }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       COMING SOON TOAST
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(6,14,34,.94);
      border: 1px solid rgba(255,215,0,.38);
      border-radius: 32px; padding: 11px 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gold);
      box-shadow: 0 0 28px rgba(255,215,0,.22);
      opacity: 0; pointer-events: none; z-index: 9999;
      transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* shared spin keyframes */
    @keyframes spin  { to { transform: rotate( 360deg); } }
    @keyframes spinR { to { transform: rotate(-360deg); } }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RESPONSIVE TWEAKS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (max-width: 360px) {
      .coin-zone { width: 205px; height: 205px; }
      .stat-val  { font-size: 13px; }
      .hdr-nick  { font-size: 11px; }
      .hdr-avatar { width: 42px; height: 42px; }
    }
    @media (max-height: 680px) {
      .coin-zone  { width: 200px; height: 200px; }
      .inner      { padding-top: 10px; }
      .stats-row  { margin-bottom: 12px; }
      .tap-hint   { margin-bottom: 6px; }
      .energy-box { margin-bottom: 12px; }
      .coin-wrap  { margin-bottom: 12px; }
    }
    @media (max-height: 580px) {
      .coin-zone    { width: 175px; height: 175px; }
      .energy-box,
      .grid2        { display: none; }
    }
  </style>
</head>
<body>

<!-- ── Background ── -->
<div class="bg-space"></div>
<div class="bg-hex"></div>
<div class="bg-lines"></div>
<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="orb orb-c"></div>
<div class="pts">
  <div class="pt"></div><div class="pt"></div><div class="pt"></div>
  <div class="pt"></div><div class="pt"></div><div class="pt"></div>
  <div class="pt"></div><div class="pt"></div>
</div>

<!-- ── Loader ── -->
<div id="loader">
  <div class="ld-ring">
    <img src="logoveltix.png" class="ld-logo" alt="VELTIX">
  </div>
  <div class="ld-text">Loading…</div>
</div>

<!-- ── App ── -->
<div id="app">

  <!-- HEADER -->
  <header class="hdr">
    <!-- Avatar with online dot -->
    <div class="hdr-avatar">
      <div class="hdr-avatar-glow"></div>
      <div class="hdr-avatar-ring"></div>
      <div class="hdr-avatar-inner" id="avatarEl">?</div>
      <div class="hdr-online"></div>
    </div>

    <!-- Name + level + XP bar -->
    <div class="hdr-info">
      <div class="hdr-nick" id="nickEl">—</div>
      <div class="hdr-sub">
        <span class="hdr-lvl" id="lvlBadge">LV 1</span>
        <span class="hdr-rank" id="rankEl">NOVICE</span>
      </div>
      <div class="hdr-xp-track">
        <div class="hdr-xp-fill" id="xpBar" style="width:0%"></div>
      </div>
    </div>

    <!-- Coin count pill -->
    <div class="hdr-coins">
      <img src="logoveltix.png" class="hdr-coin-icon" alt="">
      <span class="hdr-coin-val" id="hdrCoins">0</span>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="content">
    <div class="inner">

      <!-- Stats row -->
      <div class="stats-row">
        <div class="stat-card c-gold">
          <div class="stat-emoji">🪙</div>
          <div class="stat-val" id="s-coins">0</div>
          <div class="stat-lbl">Coins</div>
        </div>
        <div class="stat-card c-cyan">
          <div class="stat-emoji">⚡</div>
          <div class="stat-val" id="s-energy">500</div>
          <div class="stat-lbl">Energy</div>
        </div>
        <div class="stat-card c-green">
          <div class="stat-emoji">🏆</div>
          <div class="stat-val" id="s-level">1</div>
          <div class="stat-lbl">Level</div>
        </div>
      </div>

      <!-- Coin -->
      <div class="coin-wrap">
        <div class="coin-zone" id="coinZone"
             onclick="doTap(event)" ontouchstart="doTap(event)">
          <div class="coin-aura" id="coinAura"></div>
          <div class="coin-aura-gold"></div>

          <!-- Orbiting particles -->
          <div class="orbit-ring">
            <div class="orbit-dot"></div>
            <div class="orbit-dot"></div>
            <div class="orbit-dot"></div>
            <div class="orbit-dot"></div>

          <div class="rg1"></div>

          <img src="logoveltix.png" class="coin-img" id="coinImg" alt="VELTIX" draggable="false">

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     FIREBASE + GAME LOGIC
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<script type="module">
import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
                               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
                               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ── Firebase init ─────────────────────────────────────────── */
const app  = initializeApp({
  apiKey:     "AIzaSyCU5JdLURDc23XCZPZU49EIc_BdNgllsno",
  authDomain: "veltix-game.firebaseapp.com",
  projectId:  "veltix-game"
});
const auth = getAuth(app);
const db   = getFirestore(app);

/* ── Constants ─────────────────────────────────────────────── */
const BASE_ENERGY  = 500;
const REGEN_MS     = 3000;   // +1 energy every 3 s
const SAVE_DELAY   = 1500;   // debounce Firestore writes
const SPARK_COLORS = ["#00f0ff","#ffd700","#ffffff","#ff9900","#00ff88","#ff66cc","#00ccff","#ffaa00"];

/* ── Rank thresholds ───────────────────────────────────────── */
const RANKS = [
  { min: 1,  label: "NOVICE"    },
  { min: 5,  label: "ROOKIE"    },
  { min: 10, label: "WARRIOR"   },
  { min: 20, label: "ELITE"     },
  { min: 35, label: "CHAMPION"  },
  { min: 50, label: "LEGEND"    },
  { min: 75, label: "MYTH"      },
  { min: 100,label: "GOD"       },
];

/* ── State ─────────────────────────────────────────────────── */
let G = { coin: 0, level: 1, energy: BASE_ENERGY, tapLvl: 0, energyLvl: 0 };
function getMaxEnergy() { return BASE_ENERGY + G.energyLvl * 100; }
let userRef   = null;
let saveTimer = null;

/* ── Auth guard ────────────────────────────────────────────── */
onAuthStateChanged(auth, async (user) => {
  if (!user || !user.emailVerified) {
    window.location.href = "/login.html";
    return;
  }

  // Resolve nickname
  const nick    = user.displayName || user.email.split("@")[0];
  const initial = nick.charAt(0).toUpperCase();

  document.getElementById("nickEl").textContent   = nick;
  document.getElementById("avatarEl").textContent = initial;

  userRef = doc(db, "players", user.uid);
  await loadData();

  render();
  startRegen();

  document.getElementById("loader").classList.add("out");
  document.getElementById("app").classList.add("show");
});

/* ── Firestore load / save ─────────────────────────────────── */
async function loadData() {
  try {
    const snap = await getDoc(userRef);
    if (snap.exists()) {
      const d = snap.data();
      G.coin       = d.coin       ?? 0;
      G.level      = d.level      ?? 1;
      G.energy     = Math.min(d.energy ?? BASE_ENERGY, getMaxEnergy());
      G.tapLvl     = d.tapLvl     ?? 0;
      G.energyLvl  = d.energyLvl  ?? 0;
      // Re-cap energy now that energyLvl is known
      G.energy     = Math.min(G.energy, getMaxEnergy());
    }
  } catch (e) { console.warn("Load failed:", e.message); }
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!userRef) return;
    setDoc(userRef, { coin: G.coin, level: G.level, energy: G.energy, tapLvl: G.tapLvl, energyLvl: G.energyLvl }, { merge: true })
      .catch(e => console.warn("Save failed:", e.message));
  }, SAVE_DELAY);
}

/* ── Helpers ────────────────────────────────────────────────── */
function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1)+"M";
  if (n >= 1e3) return (n/1e3).toFixed(1)+"K";
  return String(n);
}

function getRank(lvl) {
  let rank = RANKS[0];
  for (const r of RANKS) { if (lvl >= r.min) rank = r; }
  return rank.label;
}

function getXpPct(lvl) {
  // XP within current level bracket (every 10 levels = full bar)
  return ((lvl - 1) % 10) / 10 * 100;
}

/* ── Render ────────────────────────────────────────────────── */
function render() {
  const power = Math.floor((G.level - 1) / 10) + 1 + G.tapLvl;
  const pct   = Math.round(G.energy / getMaxEnergy() * 100);
  const low   = G.energy < getMaxEnergy() * 0.25;

  // Header
  document.getElementById("hdrCoins").textContent  = fmtNum(G.coin);
  document.getElementById("lvlBadge").textContent   = "LV " + G.level;
  document.getElementById("rankEl").textContent     = getRank(G.level);
  document.getElementById("xpBar").style.width      = getXpPct(G.level) + "%";

  // Stats row
  document.getElementById("s-coins").textContent   = fmtNum(G.coin);
  document.getElementById("s-energy").textContent  = G.energy;
  document.getElementById("s-level").textContent   = G.level;

  // Energy bar + low state
  document.getElementById("eVal").textContent      = G.energy;
  document.getElementById("eMax").textContent      = getMaxEnergy();
  document.getElementById("eBar").style.width      = pct + "%";
  document.getElementById("ePct").textContent      = pct + "%";
  document.getElementById("energyBox").classList.toggle("low", low);

  // Cards
  document.getElementById("ic-total").textContent  = fmtNum(G.coin);
  document.getElementById("ic-power").textContent  = "+" + power;

  // Tap hint changes when empty
  document.getElementById("tapHint").textContent   = G.energy <= 0 ? "◆ NO ENERGY ◆" : "◆ TAP TO EARN ◆";
}

function popEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("pop");
  void el.offsetWidth;
  el.classList.add("pop");
  setTimeout(() => el.classList.remove("pop"), 260);
}

/* ── Energy regen ──────────────────────────────────────────── */
function startRegen() {
  setInterval(() => {
    const maxE = getMaxEnergy();
    if (G.energy < maxE) {
      G.energy = Math.min(G.energy + 1, maxE);
      const pct = Math.round(G.energy / maxE * 100);
      const low = G.energy < maxE * 0.25;
      document.getElementById("s-energy").textContent = G.energy;
      document.getElementById("eVal").textContent     = G.energy;
      document.getElementById("eBar").style.width     = pct + "%";
      document.getElementById("ePct").textContent     = pct + "%";
      document.getElementById("energyBox").classList.toggle("low", low);
      document.getElementById("tapHint").textContent  = G.energy <= 0 ? "◆ NO ENERGY ◆" : "◆ TAP TO EARN ◆";
    }
  }, REGEN_MS);
}

/* ── Visual FX ─────────────────────────────────────────────── */
function spawnSparks(x, y, n = 14) {
  for (let i = 0; i < n; i++) {
    const el     = document.createElement("div");
    const isStar = i % 3 === 0;
    el.className = isStar ? "fx-spark star" : "fx-spark round";
    const angle  = (360 / n) * i + (Math.random() - .5) * 28;
    const dist   = 55 + Math.random() * 90;
    const rad    = angle * Math.PI / 180;
    const size   = isStar ? 7 + Math.random() * 5 : 3 + Math.random() * 5;
    const clr    = SPARK_COLORS[i % SPARK_COLORS.length];
    const rot    = (Math.random() * 360).toFixed(0) + "deg";
    el.style.cssText = `
      left:${x}px; top:${y}px;
      width:${size}px; height:${size}px;
      background:${clr};
      box-shadow:0 0 ${isStar?8:5}px ${clr};
      --x:${(Math.cos(rad)*dist).toFixed(1)}px;
      --y:${(Math.sin(rad)*dist).toFixed(1)}px;
      --d:${(.28+Math.random()*.52).toFixed(2)}s;
      --r:${rot};
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 850);
  }
}

function spawnRipple(x, y) {
  const el = document.createElement("div");
  el.className = "fx-ripple";
  el.style.cssText = `left:${x}px; top:${y}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 620);

  const el2 = document.createElement("div");
  el2.className = "fx-ripple-gold";
  el2.style.cssText = `left:${x}px; top:${y}px;`;
  document.body.appendChild(el2);
  setTimeout(() => el2.remove(), 820);
}

function spawnPlus(x, y, amt) {
  const spread = (Math.random() - .5) * 48;
  const el  = document.createElement("div");
  el.className = "fx-plus";
  const img = document.createElement("img");
  img.src = "logoveltix.png";
  img.className = "fx-plus-img";
  const txt = document.createElement("span");
  txt.textContent = "+" + amt;
  el.appendChild(img);
  el.appendChild(txt);
  el.style.cssText = `left:${x + spread}px; top:${y - 18}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1020);
}

function spawnCoinImg(x, y) {
  const spread = (Math.random() - .5) * 30;
  const el = document.createElement("img");
  el.src = "logoveltix.png";
  el.className = "fx-coin";
  el.style.cssText = `left:${x - 14 + spread}px; top:${y - 14}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1150);
}

function spawnNoEnergy(x, y) {
  const el = document.createElement("div");
  el.className = "fx-nrg";
  el.textContent = "NO ENERGY";
  el.style.cssText = `left:${x}px; top:${y}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 820);
}

function bounceCoin() {
  const z = document.getElementById("coinZone");
  z.classList.remove("tapped");
  void z.offsetWidth;
  z.classList.add("tapped");
  setTimeout(() => z.classList.remove("tapped"), 400);
}

function shakeEmpty(x, y) {
  const z = document.getElementById("coinZone");
  z.classList.remove("empty");
  void z.offsetWidth;
  z.classList.add("empty");
  setTimeout(() => z.classList.remove("empty"), 340);
  spawnNoEnergy(x, y);
}

/* ── Tap handler ───────────────────────────────────────────── */
let lastTap = 0;

window.doTap = function(ev) {
  ev.preventDefault();
  const now = Date.now();
  if (now - lastTap < 80) return;
  lastTap = now;

  let x, y;
  if (ev.touches && ev.touches.length) {
    x = ev.touches[0].clientX;
    y = ev.touches[0].clientY;
  } else {
    x = ev.clientX;
    y = ev.clientY;
  }

  if (G.energy <= 0) { shakeEmpty(x, y); return; }

  const power = Math.floor((G.level - 1) / 10) + 1 + G.tapLvl;
  G.coin  += power;
  G.energy = Math.max(0, G.energy - 1);

  // Subtle haptic on mobile
  if (navigator.vibrate) navigator.vibrate(8);

  save();
  render();

  bounceCoin();
  popEl("s-coins");
  popEl("hdrCoins");
  spawnRipple(x, y);
  spawnSparks(x, y, 14);
  spawnCoinImg(x, y);
  spawnPlus(x, y, power);
};

/* ── Nav tab routing ───────────────────────────────────────── */
let toastTimer = null;

window.goTab = function(tab, el) {
  if (tab === "earn")    { window.location.href = "/earn.html";    return; }
  if (tab === "shop")    { window.location.href = "/shop.html";    return; }
  if (tab === "profile") { window.location.href = "/profile.html"; return; }

  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");

  if (tab !== "home") {
    // Show coming-soon toast; reset to home after 2 s
    const toast = document.getElementById("toast");
    toast.textContent = "◆ COMING SOON ◆";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("nb-home").classList.add("active");
    }, 2000);
  }
};

/* ── Logout (callable from future profile page) ─────────────── */
window.doLogout = function() {
  save();
  setTimeout(() => {
    signOut(auth).then(() => { window.location.href = "/login.html"; });
  }, SAVE_DELAY + 200);
};
</script>
