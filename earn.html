<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VELTIX — Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Earn VELTIX coins through daily rewards, tasks, and achievements.">
  <meta name="theme-color" content="#00f0ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RESET & TOKENS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:     #00f0ff;
      --cyan-dim: rgba(0,240,255,.12);
      --gold:     #ffd700;
      --gold-dim: rgba(255,215,0,.12);
      --green:    #00e676;
      --red:      #ff4d4d;
      --purple:   #bb66ff;
      --dark:     #03080f;
      --surface:  rgba(6,14,34,.82);
      --border:   rgba(0,240,255,.1);
      --nav-h:    72px;
      --hdr-h:    80px;
      --safe-b:   env(safe-area-inset-bottom, 0px);
    }

    html { height: 100%; }
    body {
      height: 100%; width: 100%;
      background: var(--dark);
      color: #fff;
      font-family: 'Rajdhani', system-ui, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BACKGROUND
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .bg-space {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 130% 70% at 50% -10%, #071a45 0%, transparent 58%),
        radial-gradient(ellipse 70% 55% at 100% 110%, #1b0438 0%, transparent 52%),
        radial-gradient(ellipse 60% 50% at -5% 90%,  #011d36 0%, transparent 48%),
        #03080f;
    }
    .bg-hex {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: radial-gradient(circle, rgba(0,240,255,.08) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 10%, transparent 100%);
      animation: hexMove 22s linear infinite;
    }
    @keyframes hexMove { to { background-position: 34px 34px; } }
    .bg-lines {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,240,255,.006) 2px, rgba(0,240,255,.006) 3px
      );
    }
    .orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
      filter: blur(120px); animation: orbDrift 16s ease-in-out infinite alternate;
    }
    .orb-a { width:500px; height:500px; background:#0080cc; opacity:.07; top:-200px; left:-180px; }
    .orb-b { width:380px; height:380px; background:#cc8800; opacity:.06; bottom:-150px; right:-150px; animation-delay:-7s; }
    .orb-c { width:220px; height:220px; background:#5500cc; opacity:.08; top:40%; left:62%; animation-delay:-12s; }
    @keyframes orbDrift { from{transform:translate(0,0) scale(1);} to{transform:translate(40px,24px) scale(1.12);} }
    .pts { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
    .pt  { position:absolute; border-radius:50%; opacity:0; animation:ptRise linear infinite; }
    .pt:nth-child(1)  { left: 6%; width:3px;height:3px; background:var(--gold); animation-duration:11s; animation-delay:0s; }
    .pt:nth-child(2)  { left:16%; width:2px;height:2px; background:var(--cyan); animation-duration:14s; animation-delay:2s; }
    .pt:nth-child(3)  { left:28%; width:2px;height:2px; background:var(--gold); animation-duration: 9s; animation-delay:5s; }
    .pt:nth-child(4)  { left:40%; width:2px;height:2px; background:var(--cyan); animation-duration:12s; animation-delay:1s; }
    .pt:nth-child(5)  { left:53%; width:3px;height:3px; background:var(--gold); animation-duration: 8s; animation-delay:3.5s; }
    .pt:nth-child(6)  { left:65%; width:2px;height:2px; background:var(--cyan); animation-duration:15s; animation-delay:0.5s; }
    .pt:nth-child(7)  { left:78%; width:2px;height:2px; background:var(--gold); animation-duration:10s; animation-delay:4s; }
    .pt:nth-child(8)  { left:90%; width:2px;height:2px; background:var(--cyan); animation-duration:12s; animation-delay:7s; }
    @keyframes ptRise {
      0%   { transform:translateY(105vh); opacity:0; }
      8%   { opacity:.75; }
      90%  { opacity:.3; }
      100% { transform:translateY(-5vh) translateX(18px); opacity:0; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       LOADER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: var(--dark);
      transition: opacity .55s ease, visibility .55s ease;
    }
    #loader.out { opacity: 0; visibility: hidden; pointer-events: none; }
    .ld-ring { position: relative; width: 84px; height: 84px; }
    .ld-ring::before {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--cyan) 0%, var(--gold) 50%, var(--cyan) 100%);
      animation: spin 1.3s linear infinite;
    }
    .ld-ring::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--cyan), var(--gold), var(--cyan));
      filter: blur(8px); opacity: .5; animation: spin 1.3s linear infinite;
    }
    .ld-logo {
      position: relative; z-index: 1;
      width: 76px; height: 76px; border-radius: 50%;
      object-fit: cover; display: block; margin: auto;
      border: 3px solid var(--dark);
    }
    .ld-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(0,240,255,.5);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.3;} 50%{opacity:1;} }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       APP SHELL
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #app {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      opacity: 0; transition: opacity .5s ease;
    }
    #app.show { opacity: 1; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       HEADER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .hdr {
      position: relative; z-index: 50;
      height: var(--hdr-h); flex-shrink: 0;
      display: flex; align-items: center;
      padding: 0 14px; gap: 11px;
      background: rgba(3,8,15,.88);
      backdrop-filter: blur(28px) saturate(1.5);
      border-bottom: 1px solid var(--border);
    }
    .hdr::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 30%, var(--gold) 70%, transparent 100%);
      opacity: .4;
    }
    .hdr-avatar {
      position: relative; flex-shrink: 0;
      width: 48px; height: 48px;
    }
    .hdr-avatar-ring {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--gold), var(--cyan), #ff9900, var(--gold));
      animation: spin 5s linear infinite;
    }
    .hdr-avatar-glow {
      position: absolute; inset: -6px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--gold), var(--cyan), var(--gold));
      filter: blur(8px); opacity: .35;
      animation: spin 5s linear infinite;
    }
    .hdr-avatar-inner {
      position: absolute; inset: 0; border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,240,255,.22), rgba(255,215,0,.15));
      border: 2px solid rgba(3,8,15,.95);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 19px; font-weight: 900;
      color: var(--cyan); text-shadow: 0 0 14px var(--cyan);
      z-index: 1;
    }
    .hdr-online {
      position: absolute; bottom: 1px; right: 1px; z-index: 2;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green);
      border: 2px solid rgba(3,8,15,.95);
      box-shadow: 0 0 8px var(--green);
      animation: onlinePulse 2.2s ease-in-out infinite;
    }
    @keyframes onlinePulse { 0%,100%{box-shadow:0 0 6px var(--green);} 50%{box-shadow:0 0 14px var(--green),0 0 24px rgba(0,230,118,.5);} }
    .hdr-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .hdr-nick {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: .5px;
      color: #fff; line-height: 1.1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hdr-sub { display: flex; align-items: center; gap: 6px; }
    .hdr-lvl {
      font-family: 'Orbitron', sans-serif;
      font-size: 8px; font-weight: 700; letter-spacing: 1.5px;
      color: var(--gold);
      background: linear-gradient(135deg, rgba(25,16,0,.95), rgba(50,32,0,.95));
      border: 1px solid rgba(255,215,0,.4);
      border-radius: 6px; padding: 2px 7px;
      box-shadow: 0 0 10px rgba(255,215,0,.2);
    }
    .hdr-rank { font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(0,240,255,.4); }
    .hdr-xp-track { height: 3px; border-radius: 3px; background: rgba(0,240,255,.08); overflow: hidden; }
    .hdr-xp-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      box-shadow: 0 0 8px rgba(0,240,255,.6);
      transition: width .6s cubic-bezier(.34,1.56,.64,1);
    }
    .hdr-coins {
      display: flex; align-items: center; gap: 5px;
      background: linear-gradient(135deg, rgba(255,215,0,.1), rgba(255,165,0,.06));
      border: 1px solid rgba(255,215,0,.25);
      border-radius: 22px; padding: 6px 11px 6px 7px;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(255,215,0,.1);
    }
    .hdr-coin-icon {
      width: 22px; height: 22px; border-radius: 50%; object-fit: cover;
      filter: drop-shadow(0 0 5px rgba(255,215,0,.7));
    }
    .hdr-coin-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 900;
      color: var(--gold); text-shadow: 0 0 12px rgba(255,215,0,.6);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SCROLLABLE CONTENT
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
      scrollbar-width: none; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }
    .inner {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 14px 0;
      max-width: 480px; margin: 0 auto;
      gap: 20px;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       PAGE TITLE
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .page-title {
      width: 100%; text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; letter-spacing: 5px;
      color: rgba(0,240,255,.45);
      display: flex; align-items: center; gap: 10px;
      justify-content: center;
    }
    .page-title::before, .page-title::after {
      content: '';
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,.25));
    }
    .page-title::after { background: linear-gradient(270deg, transparent, rgba(0,240,255,.25)); }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SECTION LABELS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .sec-label {
      width: 100%;
      display: flex; align-items: center; gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    }
    .sec-label .sec-icon { font-size: 14px; }
    .sec-label .sec-text { color: rgba(255,255,255,.5); }
    .sec-label::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,.1), transparent);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       DAILY REWARD CARD
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .daily-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(12,8,2,.9) 0%, rgba(30,20,0,.85) 50%, rgba(12,8,2,.9) 100%);
      border: 1px solid rgba(255,215,0,.3);
      border-radius: 24px;
      padding: 22px 20px 18px;
      position: relative; overflow: hidden;
      box-shadow: 0 0 40px rgba(255,215,0,.08), inset 0 1px 0 rgba(255,215,0,.1);
    }
    /* Top shimmer stripe */
    .daily-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold) 30%, #fff8b0 50%, var(--gold) 70%, transparent);
      box-shadow: 0 0 20px rgba(255,215,0,.5);
    }
    /* Corner glows */
    .daily-card::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 0% 0%, rgba(255,215,0,.07) 0%, transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(255,165,0,.06) 0%, transparent 45%);
    }

    .daily-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; position: relative; z-index: 1;
    }
    .daily-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 2.5px;
      color: var(--gold); text-shadow: 0 0 14px rgba(255,215,0,.5);
    }
    .daily-streak-pill {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,215,0,.1);
      border: 1px solid rgba(255,215,0,.25);
      border-radius: 20px; padding: 4px 10px;
    }
    .daily-streak-flame { font-size: 13px; }
    .daily-streak-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 900; color: var(--gold);
    }
    .daily-streak-lbl { font-size: 9px; color: rgba(255,215,0,.5); letter-spacing: 1px; }

    /* Streak dots row */
    .streak-dots {
      display: flex; gap: 6px; justify-content: center;
      margin-bottom: 18px; position: relative; z-index: 1;
    }
    .streak-dot {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .streak-dot-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      border: 1.5px solid rgba(255,215,0,.2);
      background: rgba(255,215,0,.05);
      position: relative; overflow: hidden;
      transition: all .3s ease;
    }
    .streak-dot.done .streak-dot-circle {
      border-color: var(--gold);
      background: linear-gradient(135deg, rgba(255,215,0,.2), rgba(255,165,0,.15));
      box-shadow: 0 0 12px rgba(255,215,0,.35);
    }
    .streak-dot.today .streak-dot-circle {
      border-color: var(--gold);
      background: linear-gradient(135deg, rgba(255,215,0,.3), rgba(255,165,0,.25));
      box-shadow: 0 0 18px rgba(255,215,0,.55);
      animation: todayPulse 2s ease-in-out infinite;
    }
    @keyframes todayPulse {
      0%,100% { box-shadow: 0 0 12px rgba(255,215,0,.4); }
      50%      { box-shadow: 0 0 24px rgba(255,215,0,.7); }
    }
    .streak-dot-lbl {
      font-family: 'Orbitron', sans-serif;
      font-size: 7px; letter-spacing: 1px;
      color: rgba(255,215,0,.3);
    }
    .streak-dot.done .streak-dot-lbl,
    .streak-dot.today .streak-dot-lbl { color: rgba(255,215,0,.7); }

    /* Coin visual */
    .daily-coin-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      margin-bottom: 16px; position: relative; z-index: 1;
    }
    .daily-coin-ring {
      position: relative; width: 88px; height: 88px;
      display: flex; align-items: center; justify-content: center;
    }
    .daily-coin-ring::before {
      content: ''; position: absolute; inset: -6px; border-radius: 50%;
      background: conic-gradient(from 0deg, #3a2000, var(--gold), #fff4b0, var(--gold), #3a2000);
      animation: spin 6s linear infinite;
    }
    .daily-coin-ring::after {
      content: ''; position: absolute; inset: -6px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--gold), #fff8a0, var(--gold));
      filter: blur(10px); opacity: .4; animation: spin 6s linear infinite;
    }
    .daily-coin-img {
      width: 76px; height: 76px; border-radius: 50%; object-fit: cover;
      border: 3px solid rgba(255,215,0,.5);
      box-shadow: 0 0 20px rgba(255,215,0,.4);
      animation: dailyCoinFloat 3s ease-in-out infinite;
      position: relative; z-index: 1;
    }
    @keyframes dailyCoinFloat {
      0%,100% { transform: translateY(0) scale(1); filter: brightness(1) drop-shadow(0 0 10px var(--gold)); }
      50%      { transform: translateY(-6px) scale(1.03); filter: brightness(1.2) drop-shadow(0 0 20px var(--gold)); }
    }
    .daily-reward-amt {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px; font-weight: 900;
      color: var(--gold); text-shadow: 0 0 18px rgba(255,215,0,.7);
      letter-spacing: 1px;
    }
    .daily-reward-sub { font-size: 10px; color: rgba(255,215,0,.4); letter-spacing: 2px; }

    /* Claim button */
    .daily-btn {
      width: 100%; padding: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 3px;
      border-radius: 14px; border: none; cursor: pointer;
      position: relative; z-index: 1; overflow: hidden;
      transition: transform .15s, box-shadow .15s, opacity .2s;
      will-change: transform;
    }
    .daily-btn:active { transform: scale(.97); }
    .daily-btn.ready {
      background: linear-gradient(135deg, #b8860b, var(--gold), #ffe88a, var(--gold), #b8860b);
      background-size: 200% 100%;
      color: #0a0600;
      box-shadow: 0 0 24px rgba(255,215,0,.45), 0 4px 20px rgba(0,0,0,.4);
      animation: btnShimmer 2.5s ease infinite;
    }
    @keyframes btnShimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .daily-btn.ready::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.25) 50%, transparent 100%);
      animation: btnSweep 2.5s ease infinite;
    }
    @keyframes btnSweep { 0%{transform:translateX(-100%);} 100%{transform:translateX(200%);} }
    .daily-btn.claimed {
      background: rgba(0,230,118,.08);
      border: 1px solid rgba(0,230,118,.25);
      color: var(--green);
      cursor: default; opacity: .8;
    }
    .daily-countdown {
      text-align: center; margin-top: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; letter-spacing: 2px;
      color: rgba(255,215,0,.35);
      position: relative; z-index: 1;
    }
    .daily-countdown span { color: rgba(255,215,0,.65); }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       TASKS SECTION
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .tasks-list { width: 100%; display: flex; flex-direction: column; gap: 10px; }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 14px 14px 14px;
      display: flex; align-items: center; gap: 12px;
      position: relative; overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .3s;
      will-change: transform;
    }
    .task-card:active { transform: scale(.98); }
    .task-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,240,255,.03) 0%, transparent 55%);
      pointer-events: none;
    }
    .task-card.completed {
      border-color: rgba(0,230,118,.22);
      background: rgba(0,230,118,.04);
    }
    .task-card.completed::before {
      background: linear-gradient(135deg, rgba(0,230,118,.04) 0%, transparent 55%);
    }

    /* Left icon bubble */
    .task-icon-wrap {
      flex-shrink: 0;
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      position: relative; overflow: hidden;
    }
    .task-icon-wrap.gold  { background: rgba(255,215,0,.1);  border: 1px solid rgba(255,215,0,.2); box-shadow: 0 0 16px rgba(255,215,0,.1); }
    .task-icon-wrap.cyan  { background: rgba(0,240,255,.08); border: 1px solid rgba(0,240,255,.18); box-shadow: 0 0 16px rgba(0,240,255,.08); }
    .task-icon-wrap.green { background: rgba(0,230,118,.08); border: 1px solid rgba(0,230,118,.18); box-shadow: 0 0 16px rgba(0,230,118,.08); }
    .task-icon-wrap.purple{ background: rgba(187,102,255,.08);border: 1px solid rgba(187,102,255,.2); box-shadow: 0 0 16px rgba(187,102,255,.08); }
    .task-icon-wrap::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.06), transparent);
    }

    /* Task info */
    .task-info { flex: 1; min-width: 0; }
    .task-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: .5px;
      color: #fff; line-height: 1.2; margin-bottom: 2px;
    }
    .task-desc { font-size: 10px; color: rgba(255,255,255,.35); margin-bottom: 8px; }
    .task-progress-track {
      height: 5px; border-radius: 5px;
      background: rgba(255,255,255,.06);
      overflow: hidden; margin-bottom: 4px;
    }
    .task-progress-fill {
      height: 100%; border-radius: 5px;
      transition: width .6s cubic-bezier(.34,1.56,.64,1);
      position: relative; overflow: hidden;
    }
    .task-progress-fill::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 20px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.4));
    }
    .task-icon-wrap.gold  ~ .task-info .task-progress-fill { background: linear-gradient(90deg, #8a5f00, var(--gold)); box-shadow: 0 0 8px rgba(255,215,0,.4); }
    .task-icon-wrap.cyan  ~ .task-info .task-progress-fill { background: linear-gradient(90deg, #006080, var(--cyan)); box-shadow: 0 0 8px rgba(0,240,255,.4); }
    .task-icon-wrap.green ~ .task-info .task-progress-fill { background: linear-gradient(90deg, #005530, var(--green)); box-shadow: 0 0 8px rgba(0,230,118,.4); }
    .task-icon-wrap.purple~ .task-info .task-progress-fill { background: linear-gradient(90deg, #4a1a7a, var(--purple)); box-shadow: 0 0 8px rgba(187,102,255,.4); }
    .task-pct { font-size: 9px; color: rgba(255,255,255,.25); letter-spacing: 1px; }

    /* Reward + claim */
    .task-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .task-reward {
      display: flex; align-items: center; gap: 4px;
      background: var(--gold-dim);
      border: 1px solid rgba(255,215,0,.2);
      border-radius: 20px; padding: 3px 8px 3px 5px;
    }
    .task-reward-img { width: 14px; height: 14px; border-radius: 50%; object-fit: cover; }
    .task-reward-amt {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; font-weight: 900;
      color: var(--gold); text-shadow: 0 0 8px rgba(255,215,0,.4);
    }
    .task-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 8px; font-weight: 700; letter-spacing: 1.5px;
      padding: 6px 12px; border-radius: 10px; border: none; cursor: pointer;
      transition: transform .12s, box-shadow .12s;
      white-space: nowrap;
    }
    .task-btn:active { transform: scale(.94); }
    .task-btn.claimable {
      background: linear-gradient(135deg, #006050, #009977, var(--green));
      color: #001a0a;
      box-shadow: 0 0 14px rgba(0,230,118,.3);
    }
    .task-btn.done {
      background: rgba(0,230,118,.08);
      border: 1px solid rgba(0,230,118,.2);
      color: var(--green);
      cursor: default;
    }
    .task-btn.locked {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.25);
      cursor: default;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       INVITE FRIENDS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .invite-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(0,8,28,.9), rgba(0,20,40,.85));
      border: 1px solid rgba(0,240,255,.22);
      border-radius: 24px;
      padding: 22px 20px;
      position: relative; overflow: hidden;
      box-shadow: 0 0 40px rgba(0,240,255,.06), inset 0 1px 0 rgba(0,240,255,.08);
    }
    .invite-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan) 30%, #80f8ff 50%, var(--cyan) 70%, transparent);
      box-shadow: 0 0 16px rgba(0,240,255,.4);
    }
    .invite-card::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 0% 0%, rgba(0,240,255,.06) 0%, transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(0,200,255,.04) 0%, transparent 40%);
    }
    .invite-top {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 18px; position: relative; z-index: 1;
    }
    .invite-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: rgba(0,240,255,.1); border: 1px solid rgba(0,240,255,.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      box-shadow: 0 0 16px rgba(0,240,255,.12), inset 0 1px 0 rgba(0,240,255,.1);
    }
    .invite-text { flex: 1; }
    .invite-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 1px;
      color: var(--cyan); text-shadow: 0 0 12px rgba(0,240,255,.4);
      margin-bottom: 3px;
    }
    .invite-sub { font-size: 11px; color: rgba(0,240,255,.45); line-height: 1.4; }
    .invite-sub strong { color: var(--gold); }

    /* Stats row */
    .invite-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 16px; position: relative; z-index: 1;
    }
    .invite-stat {
      background: rgba(0,240,255,.05);
      border: 1px solid rgba(0,240,255,.1);
      border-radius: 12px; padding: 10px 8px;
      text-align: center;
    }
    .invite-stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px; font-weight: 900;
      color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,.5);
    }
    .invite-stat-lbl { font-size: 8px; letter-spacing: 1.5px; color: rgba(0,240,255,.3); margin-top: 2px; }

    /* Code row */
    .invite-code-row {
      display: flex; gap: 8px; position: relative; z-index: 1;
    }
    .invite-code-box {
      flex: 1;
      background: rgba(0,0,0,.4);
      border: 1px solid rgba(0,240,255,.18);
      border-radius: 12px; padding: 12px 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .invite-code-lbl { font-size: 9px; letter-spacing: 2px; color: rgba(0,240,255,.35); }
    .invite-code-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px; font-weight: 900; letter-spacing: 2px;
      color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,.5);
    }
    .invite-copy-btn {
      flex-shrink: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; font-weight: 700; letter-spacing: 2px;
      padding: 0 16px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, rgba(0,240,255,.15), rgba(0,200,255,.2));
      border: 1px solid rgba(0,240,255,.3);
      color: var(--cyan); box-shadow: 0 0 14px rgba(0,240,255,.15);
      transition: transform .12s, box-shadow .15s;
      min-height: 46px;
    }
    .invite-copy-btn:active { transform: scale(.95); }
    .invite-copy-btn.copied {
      background: rgba(0,230,118,.1);
      border-color: rgba(0,230,118,.3);
      color: var(--green);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       ACHIEVEMENTS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ach-grid {
      width: 100%;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .ach-card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px;
      padding: 16px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      position: relative; overflow: hidden;
      transition: transform .18s ease;
      will-change: transform;
    }
    .ach-card:active { transform: scale(.97); }
    .ach-card.unlocked {
      border-color: rgba(255,215,0,.25);
      background: linear-gradient(135deg, rgba(12,8,2,.9), rgba(20,14,0,.85));
      box-shadow: 0 0 20px rgba(255,215,0,.07);
    }
    .ach-card.unlocked.cyan-ach {
      border-color: rgba(0,240,255,.25);
      background: linear-gradient(135deg, rgba(0,8,20,.9), rgba(0,14,28,.85));
      box-shadow: 0 0 20px rgba(0,240,255,.07);
    }
    .ach-card.unlocked.green-ach {
      border-color: rgba(0,230,118,.2);
      background: linear-gradient(135deg, rgba(0,10,5,.9), rgba(0,16,8,.85));
      box-shadow: 0 0 20px rgba(0,230,118,.06);
    }
    .ach-card.unlocked.purple-ach {
      border-color: rgba(187,102,255,.2);
      background: linear-gradient(135deg, rgba(8,0,18,.9), rgba(12,0,24,.85));
      box-shadow: 0 0 20px rgba(187,102,255,.06);
    }
    /* Top accent bar */
    .ach-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      border-radius: 18px 18px 0 0;
      background: rgba(255,255,255,.05);
      transition: background .3s;
    }
    .ach-card.unlocked::before { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .ach-card.unlocked.cyan-ach::before { background: linear-gradient(90deg, transparent, var(--cyan), transparent); }
    .ach-card.unlocked.green-ach::before { background: linear-gradient(90deg, transparent, var(--green), transparent); }
    .ach-card.unlocked.purple-ach::before { background: linear-gradient(90deg, transparent, var(--purple), transparent); }

    /* Badge circle */
    .ach-badge {
      width: 54px; height: 54px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; position: relative;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      transition: all .3s;
    }
    .ach-card.unlocked .ach-badge {
      background: rgba(255,215,0,.1);
      border-color: rgba(255,215,0,.3);
      box-shadow: 0 0 20px rgba(255,215,0,.2);
      animation: achGlow 3s ease-in-out infinite;
    }
    .ach-card.unlocked.cyan-ach .ach-badge {
      background: rgba(0,240,255,.1);
      border-color: rgba(0,240,255,.3);
      box-shadow: 0 0 20px rgba(0,240,255,.2);
    }
    .ach-card.unlocked.green-ach .ach-badge {
      background: rgba(0,230,118,.1);
      border-color: rgba(0,230,118,.3);
      box-shadow: 0 0 20px rgba(0,230,118,.2);
    }
    .ach-card.unlocked.purple-ach .ach-badge {
      background: rgba(187,102,255,.1);
      border-color: rgba(187,102,255,.3);
      box-shadow: 0 0 20px rgba(187,102,255,.2);
    }
    @keyframes achGlow {
      0%,100% { box-shadow: 0 0 14px rgba(255,215,0,.2); }
      50%      { box-shadow: 0 0 26px rgba(255,215,0,.4); }
    }
    /* Lock overlay */
    .ach-lock {
      position: absolute; inset: 0; border-radius: 50%;
      background: rgba(3,8,15,.7);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: opacity .3s;
    }
    .ach-card.unlocked .ach-lock { opacity: 0; pointer-events: none; }

    .ach-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      text-align: center;
      color: rgba(255,255,255,.4);
      transition: color .3s;
    }
    .ach-card.unlocked .ach-name { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,.3); }
    .ach-card.unlocked.cyan-ach   .ach-name { color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,.3); }
    .ach-card.unlocked.green-ach  .ach-name { color: var(--green); text-shadow: 0 0 10px rgba(0,230,118,.3); }
    .ach-card.unlocked.purple-ach .ach-name { color: var(--purple); text-shadow: 0 0 10px rgba(187,102,255,.3); }

    .ach-cond { font-size: 9px; color: rgba(255,255,255,.2); text-align: center; line-height: 1.3; }

    .ach-unlocked-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 7px; letter-spacing: 1.5px;
      padding: 2px 8px; border-radius: 8px;
      background: rgba(0,230,118,.1);
      border: 1px solid rgba(0,230,118,.2);
      color: var(--green);
      opacity: 0; transition: opacity .3s;
    }
    .ach-card.unlocked .ach-unlocked-badge { opacity: 1; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       CLAIM FLASH FX
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .fx-claim {
      position: fixed; pointer-events: none; z-index: 9000;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px; font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 14px var(--gold), 0 0 28px rgba(255,215,0,.5);
      animation: fxClaimUp 1.1s cubic-bezier(.22,1,.36,1) forwards;
      white-space: nowrap; display: flex; align-items: center; gap: 5px;
    }
    .fx-claim-img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; filter: drop-shadow(0 0 5px var(--gold)); }
    @keyframes fxClaimUp {
      0%  { transform: translateY(0) scale(.8); opacity: 1; }
      25% { transform: translateY(-30px) scale(1.2); opacity: 1; }
      100%{ transform: translateY(-100px) scale(.6); opacity: 0; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BOTTOM NAVIGATION
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(3,8,15,.94);
      backdrop-filter: blur(32px) saturate(1.6);
      border-top: 1px solid var(--border);
      display: flex; align-items: stretch;
    }
    .nav::before {
      content: ''; position: absolute; top: 0; left: 6%; right: 6%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan) 32%, var(--gold) 68%, transparent);
      opacity: .35;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      border: none; background: none; cursor: pointer; padding: 0;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      transition: transform .1s ease;
    }
    .nav-btn:active { transform: scale(.92); }
    .nav-btn.active::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 2px;
      border-radius: 0 0 5px 5px;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(0,240,255,.55);
    }
    .nav-btn.active .nav-icon-wrap { filter: drop-shadow(0 0 10px var(--cyan)); }
    .nav-icon-wrap {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-icon-wrap svg {
      width: 100%; height: 100%;
      fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
      transition: stroke .2s;
    }
    .nav-btn.active .nav-icon-wrap svg { stroke: var(--cyan); }
    .nav-btn:not(.active) .nav-icon-wrap svg { stroke: rgba(255,255,255,.28); }
    .nav-btn:not(.active):active .nav-icon-wrap svg { stroke: rgba(255,255,255,.55); }
    .nav-lbl {
      font-family: 'Orbitron', sans-serif;
      font-size: 7.5px; letter-spacing: 1.5px; text-transform: uppercase;
      transition: color .2s;
    }
    .nav-btn.active .nav-lbl { color: var(--cyan); }
    .nav-btn:not(.active) .nav-lbl { color: rgba(255,255,255,.22); }

    /* Toast */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(6,14,34,.94);
      border: 1px solid rgba(255,215,0,.38);
      border-radius: 32px; padding: 11px 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gold);
      box-shadow: 0 0 28px rgba(255,215,0,.22);
      opacity: 0; pointer-events: none; z-index: 9999;
      transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes spin  { to { transform: rotate( 360deg); } }
    @keyframes spinR { to { transform: rotate(-360deg); } }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SECTION ENTRY ANIMATIONS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .anim-in {
      opacity: 0; transform: translateY(18px);
      animation: slideIn .5s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
    .anim-in:nth-child(1) { animation-delay: .05s; }
    .anim-in:nth-child(2) { animation-delay: .12s; }
    .anim-in:nth-child(3) { animation-delay: .19s; }
    .anim-in:nth-child(4) { animation-delay: .26s; }
    .anim-in:nth-child(5) { animation-delay: .33s; }
    .anim-in:nth-child(6) { animation-delay: .40s; }
    .anim-in:nth-child(7) { animation-delay: .47s; }

    @media (max-width: 360px) {
      .hdr-nick  { font-size: 11px; }
      .hdr-avatar { width: 42px; height: 42px; }
      .ach-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- ── Background ── -->
<div class="bg-space"></div>
<div class="bg-hex"></div>
<div class="bg-lines"></div>
<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="orb orb-c"></div>
<div class="pts">
  <div class="pt"></div><div class="pt"></div><div class="pt"></div>
  <div class="pt"></div><div class="pt"></div><div class="pt"></div>
  <div class="pt"></div><div class="pt"></div>
</div>

<!-- ── Loader ── -->
<div id="loader">
  <div class="ld-ring">
    <img src="logoveltix.png" class="ld-logo" alt="VELTIX">
  </div>
  <div class="ld-text">Loading…</div>
</div>

<!-- ── App ── -->
<div id="app">

  <!-- HEADER -->
  <header class="hdr">

<script type="module">
import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
                               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
                               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ── Firebase init ─────────────────────────────────────────── */
const app  = initializeApp({
  apiKey:     "AIzaSyCU5JdLURDc23XCZPZU49EIc_BdNgllsno",
  authDomain: "veltix-game.firebaseapp.com",
  projectId:  "veltix-game"
});
const auth = getAuth(app);
const db   = getFirestore(app);

/* ── Constants ─────────────────────────────────────────────── */
const MAX_ENERGY = 500;
const SAVE_DELAY = 1500;

const RANKS = [
  { min: 1,   label: "NOVICE"   },
  { min: 5,   label: "ROOKIE"   },
  { min: 10,  label: "WARRIOR"  },
  { min: 20,  label: "ELITE"    },
  { min: 35,  label: "CHAMPION" },
  { min: 50,  label: "LEGEND"   },
  { min: 75,  label: "MYTH"     },
  { min: 100, label: "GOD"      },
];

/* ── State ─────────────────────────────────────────────────── */
let G         = { coin: 0, level: 1, energy: MAX_ENERGY };
let userRef   = null;
let saveTimer = null;
let currentUid = null;

/* ── Task definitions ──────────────────────────────────────── */
const TASKS = [
  { id: "first_tap",   icon: "👆", color: "gold",   name: "FIRST CONTACT",  desc: "Make your very first tap",       target: 1,     reward: 100,  unit: "tap",  statKey: "totalTaps"  },
  { id: "tap_100",     icon: "⚡", color: "cyan",   name: "POWER SURGE",    desc: "Reach 100 total taps",           target: 100,   reward: 250,  unit: "taps", statKey: "totalTaps"  },
  { id: "tap_1000",    icon: "🔥", color: "purple", name: "TAP LEGEND",     desc: "Reach 1,000 total taps",         target: 1000,  reward: 1000, unit: "taps", statKey: "totalTaps"  },
  { id: "coins_500",   icon: "🪙", color: "gold",   name: "COIN HOARDER",   desc: "Collect 500 coins",              target: 500,   reward: 300,  unit: "coins",statKey: "coin"       },
  { id: "coins_5000",  icon: "💰", color: "gold",   name: "VAULT BREAKER",  desc: "Collect 5,000 coins",            target: 5000,  reward: 1500, unit: "coins",statKey: "coin"       },
  { id: "level_5",     icon: "🏅", color: "green",  name: "RISING STAR",    desc: "Reach Level 5",                  target: 5,     reward: 500,  unit: "lvl",  statKey: "level"      },
  { id: "level_20",    icon: "🌟", color: "purple", name: "ELITE TAPPER",   desc: "Reach Level 20",                 target: 20,    reward: 2000, unit: "lvl",  statKey: "level"      },
];

/* ── Achievement definitions ───────────────────────────────── */
const ACHIEVEMENTS = [
  { id: "ach_pioneer",   icon: "🚀", theme: "",          name: "PIONEER",      cond: "Complete your first tap",       check: (G,s) => s.totalTaps >= 1      },
  { id: "ach_centurion", icon: "⚔️", theme: "cyan-ach",  name: "CENTURION",    cond: "Reach 100 total taps",          check: (G,s) => s.totalTaps >= 100     },
  { id: "ach_millionaire",icon:"💎", theme: "gold",      name: "MILLIONAIRE",  cond: "Earn 1,000 coins",              check: (G,s) => G.coin >= 1000         },
  { id: "ach_warrior",   icon: "🏆", theme: "green-ach", name: "WARRIOR",      cond: "Reach Level 10",                check: (G,s) => G.level >= 10          },
  { id: "ach_dedicated", icon: "🔥", theme: "purple-ach",name: "DEDICATED",    cond: "Keep a 3-day streak",           check: (G,s) => s.streak >= 3          },
  { id: "ach_phantom",   icon: "👻", theme: "cyan-ach",  name: "PHANTOM",      cond: "Tap 1,000 times",               check: (G,s) => s.totalTaps >= 1000    },
  { id: "ach_legend",    icon: "🌟", theme: "purple-ach",name: "LEGEND",       cond: "Reach Level 50",                check: (G,s) => G.level >= 50          },
  { id: "ach_god",       icon: "⚡", theme: "",          name: "GOD MODE",     cond: "Earn 100,000 coins",            check: (G,s) => G.coin >= 100000       },
];

/* ── Auth guard ────────────────────────────────────────────── */
onAuthStateChanged(auth, async (user) => {
  if (!user || !user.emailVerified) {
    window.location.href = "/login.html";
    return;
  }

  currentUid = user.uid;
  const nick    = user.displayName || user.email.split("@")[0];
  const initial = nick.charAt(0).toUpperCase();

  document.getElementById("nickEl").textContent   = nick;
  document.getElementById("avatarEl").textContent = initial;

  // Invite code from uid
  document.getElementById("inviteCode").textContent = user.uid.slice(0,8).toUpperCase();

  userRef = doc(db, "players", user.uid);
  await loadData();

  renderHeader();
  buildTaskList();
  buildAchGrid();
  initDaily();
  startCountdown();

  document.getElementById("loader").classList.add("out");
  document.getElementById("app").classList.add("show");
});

/* ── Firestore load / save ─────────────────────────────────── */
async function loadData() {
  try {
    const snap = await getDoc(userRef);
    if (snap.exists()) {
      const d = snap.data();
      G.coin   = d.coin   ?? 0;
      G.level  = d.level  ?? 1;
      G.energy = Math.min(d.energy ?? MAX_ENERGY, MAX_ENERGY);
    }
  } catch (e) { console.warn("Load failed:", e.message); }
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!userRef) return;
    setDoc(userRef, { coin: G.coin, level: G.level, energy: G.energy }, { merge: true })
      .catch(e => console.warn("Save failed:", e.message));
  }, SAVE_DELAY);
}

/* ── Helpers ────────────────────────────────────────────────── */
function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1)+"M";
  if (n >= 1e3) return (n/1e3).toFixed(1)+"K";
  return String(n);
}
function getRank(lvl) {
  let r = RANKS[0];
  for (const x of RANKS) { if (lvl >= x.min) r = x; }
  return r.label;
}
function getXpPct(lvl) { return ((lvl - 1) % 10) / 10 * 100; }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

/* ── localStorage keys (namespaced by uid) ─────────────────── */
function lsKey(k) { return `veltix_${currentUid}_${k}`; }
function lsGet(k, def) { try { const v = localStorage.getItem(lsKey(k)); return v === null ? def : JSON.parse(v); } catch { return def; } }
function lsSet(k, v) { try { localStorage.setItem(lsKey(k), JSON.stringify(v)); } catch {} }

/* ── Stats tracker ─────────────────────────────────────────── */
function getStats() {
  return lsGet("stats", { totalTaps: 0, streak: 0 });
}

/* ── Header render ─────────────────────────────────────────── */
function renderHeader() {
  document.getElementById("hdrCoins").textContent = fmtNum(G.coin);
  document.getElementById("lvlBadge").textContent = "LV " + G.level;
  document.getElementById("rankEl").textContent   = getRank(G.level);
  document.getElementById("xpBar").style.width    = getXpPct(G.level) + "%";
}

/* ── Daily Reward ──────────────────────────────────────────── */
const DAILY_REWARDS = [100, 150, 200, 250, 300, 400, 500]; // day 1–7

function initDaily() {
  const lastDate  = lsGet("daily_last", "");
  const streak    = lsGet("daily_streak", 0);
  const today     = todayStr();
  const claimed   = lastDate === today;

  // If yesterday was last claim, streak continues; otherwise reset
  const yesterday = (() => {
    const d = new Date(); d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  })();
  const activeStreak = claimed ? streak : (lastDate === yesterday ? streak : 0);

  const dayIdx = Math.min(activeStreak, 6); // 0–6 → reward index
  const reward = DAILY_REWARDS[dayIdx];

  document.getElementById("streakNum").textContent = activeStreak;
  document.getElementById("dailyAmt").textContent  = "+" + reward;

  // Build 7-day dot row
  const dotsEl = document.getElementById("streakDots");
  dotsEl.innerHTML = "";
  const dayEmojis = ["🪙","🪙","💫","⚡","🔥","💎","🌟"];
  for (let i = 0; i < 7; i++) {
    const dot = document.createElement("div");
    dot.className = "streak-dot" +
      (i < activeStreak ? " done" : "") +
      (i === (claimed ? activeStreak - 1 : activeStreak) && i < 7 ? (claimed && i === activeStreak-1 ? " done" : !claimed && i === activeStreak ? " today" : "") : "");
    // Simpler: mark done for < streak, today for === streak (unclaimed)
    dot.className = "streak-dot";
    if (i < (claimed ? activeStreak : activeStreak)) dot.classList.add("done");
    if (!claimed && i === activeStreak) dot.classList.add("today");
    dot.innerHTML = `
      <div class="streak-dot-circle">${dayEmojis[i]}
        <div class="ach-lock" style="${i < activeStreak || (!claimed && i === activeStreak) ? "opacity:0" : ""}">🔒</div>
      </div>
      <div class="streak-dot-lbl">D${i+1}</div>`;
    dotsEl.appendChild(dot);
  }

  // Button state
  const btn = document.getElementById("dailyBtn");
  if (claimed) {
    btn.className = "daily-btn claimed";
    btn.textContent = "✓ CLAIMED TODAY";
    btn.disabled = true;
  } else {
    btn.className = "daily-btn ready";
    btn.innerHTML = "⚡ CLAIM REWARD";
    btn.disabled = false;
  }
}

window.claimDaily = function() {
  const lastDate = lsGet("daily_last", "");
  const streak   = lsGet("daily_streak", 0);
  const today    = todayStr();
  if (lastDate === today) return;

  const yesterday = (() => {
    const d = new Date(); d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  })();

  const newStreak = (lastDate === yesterday) ? streak + 1 : 1;
  const dayIdx    = Math.min(newStreak - 1, 6);
  const reward    = DAILY_REWARDS[dayIdx];

  lsSet("daily_last",   today);
  lsSet("daily_streak", newStreak);

  G.coin += reward;
  save();
  renderHeader();

  // FX
  spawnClaimFX(reward);
  if (navigator.vibrate) navigator.vibrate([20, 40, 20]);

  // Refresh daily UI
  initDaily();
  buildAchGrid(); // streak may unlock achievement
};

/* ── Tasks ─────────────────────────────────────────────────── */
function getTasksClaimed() { return lsGet("tasks_claimed", {}); }

function getTaskProgress(task) {
  const stats = getStats();
  const val = task.statKey === "coin" ? G.coin
            : task.statKey === "level" ? G.level
            : (stats[task.statKey] ?? 0);
  return Math.min(val, task.target);
}

function buildTaskList() {
  const claimed = getTasksClaimed();
  const list = document.getElementById("tasksList");
  list.innerHTML = "";

  TASKS.forEach((task, idx) => {
    const progress  = getTaskProgress(task);
    const pct       = Math.round(progress / task.target * 100);
    const isComplete= progress >= task.target;
    const isClaimed = !!claimed[task.id];

    const card = document.createElement("div");
    card.className = "task-card anim-in" + (isClaimed ? " completed" : "");
    card.style.animationDelay = (0.08 + idx * 0.07) + "s";

    // Determine progress fill class
    const fillColor = task.color;

    let btnHtml;
    if (isClaimed) {
      btnHtml = `<button class="task-btn done" disabled>✓ DONE</button>`;
    } else if (isComplete) {
      btnHtml = `<button class="task-btn claimable" onclick="claimTask('${task.id}',${task.reward},this)">CLAIM</button>`;
    } else {
      btnHtml = `<button class="task-btn locked" disabled>LOCKED</button>`;
    }

    card.innerHTML = `
      <div class="task-icon-wrap ${task.color}">${task.icon}</div>
      <div class="task-info">
        <div class="task-name">${task.name}</div>
        <div class="task-desc">${task.desc}</div>
        <div class="task-progress-track">
          <div class="task-progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="task-pct">${fmtNum(progress)} / ${fmtNum(task.target)} ${task.unit}</div>
      </div>
      <div class="task-right">
        <div class="task-reward">
          <img src="logoveltix.png" class="task-reward-img" alt="">
          <span class="task-reward-amt">+${fmtNum(task.reward)}</span>
        </div>
        ${btnHtml}
      </div>`;
    list.appendChild(card);
  });
}

window.claimTask = function(taskId, reward, btnEl) {
  const claimed = getTasksClaimed();
  if (claimed[taskId]) return;
  const task = TASKS.find(t => t.id === taskId);
  if (!task || getTaskProgress(task) < task.target) return;

  claimed[taskId] = true;
  lsSet("tasks_claimed", claimed);

  G.coin += reward;
  save();
  renderHeader();

  // FX
  const rect = btnEl.getBoundingClientRect();
  spawnClaimFX(reward, rect.left + rect.width/2, rect.top);
  if (navigator.vibrate) navigator.vibrate(15);

  // Rebuild list
  buildTaskList();
  buildAchGrid();
};

/* ── Achievements ───────────────────────────────────────────── */
function buildAchGrid() {
  const stats = getStats();
  const grid  = document.getElementById("achGrid");
  grid.innerHTML = "";

  ACHIEVEMENTS.forEach((ach, idx) => {
    const unlocked = ach.check(G, stats);
    const card = document.createElement("div");
    card.className = "ach-card anim-in" + (unlocked ? " unlocked" : "") + (ach.theme ? " " + ach.theme : "");
    card.style.animationDelay = (0.1 + idx * 0.06) + "s";
    card.innerHTML = `
      <div class="ach-badge">
        ${ach.icon}
        <div class="ach-lock">🔒</div>
      </div>
      <div class="ach-name">${ach.name}</div>
      <div class="ach-cond">${ach.cond}</div>
      <div class="ach-unlocked-badge">UNLOCKED</div>`;
    grid.appendChild(card);
  });
}

/* ── Invite / Copy ──────────────────────────────────────────── */
window.copyCode = function() {
  const code = document.getElementById("inviteCode").textContent;
  const btn  = document.getElementById("copyBtn");
  const msg  = `Join VELTIX and use my code ${code} to start earning!\nhttps://tapgame-muvahhidj.replit.app`;
  if (navigator.share) {
    navigator.share({ title: "Join VELTIX", text: msg }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(msg).then(() => {
      btn.textContent = "✓ COPIED";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "COPY"; btn.classList.remove("copied"); }, 2000);
    });
  } else {
    btn.textContent = "✓ DONE";
    setTimeout(() => { btn.textContent = "COPY"; }, 2000);
  }
  if (navigator.vibrate) navigator.vibrate(10);
};

/* ── Countdown timer ────────────────────────────────────────── */
function startCountdown() {
  function tick() {
    const now    = new Date();
    const midnight = new Date(now);
    midnight.setHours(24,0,0,0);
    const diff = Math.max(0, midnight - now);
    const h  = String(Math.floor(diff / 3600000)).padStart(2,"0");
    const m  = String(Math.floor((diff % 3600000) / 60000)).padStart(2,"0");
    const s  = String(Math.floor((diff % 60000) / 1000)).padStart(2,"0");
    const el = document.getElementById("dailyCountdown");
    const lastDate = lsGet("daily_last", "");
    if (lastDate === todayStr()) {
      el.innerHTML = `Next reward in <span>${h}:${m}:${s}</span>`;
    } else {
      el.innerHTML = "";
    }
  }
  tick();
  setInterval(tick, 1000);
}

/* ── Claim FX ───────────────────────────────────────────────── */
function spawnClaimFX(amt, x, y) {
  const cx = x ?? window.innerWidth / 2;
  const cy = y ?? window.innerHeight / 2 - 60;
  const el = document.createElement("div");
  el.className = "fx-claim";
  const img = document.createElement("img");
  img.src = "logoveltix.png"; img.className = "fx-claim-img";
  const txt = document.createElement("span");
  txt.textContent = "+" + fmtNum(amt);
  el.appendChild(img); el.appendChild(txt);
  el.style.cssText = `left:${cx - 40}px; top:${cy}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1150);
}

/* ── Nav ────────────────────────────────────────────────────── */
let toastTimer = null;
window.navTo = function(tab) {
  if (tab === "home") { window.location.href = "/dashboard.html"; return; }
  // Shop / profile → coming soon toast
  const toast = document.getElementById("toast");
  toast.textContent = "◆ COMING SOON ◆";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
};

/* ── Logout ─────────────────────────────────────────────────── */
window.doLogout = function() {
  clearTimeout(saveTimer);
  setDoc(userRef, { coin: G.coin, level: G.level, energy: G.energy }, { merge: true })
    .catch(() => {})
    .finally(() => signOut(auth).then(() => { window.location.href = "/login.html"; }));
};
</script>
